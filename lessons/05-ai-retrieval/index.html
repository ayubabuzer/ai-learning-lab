rflow:hidden;clip:rect(0,0,0,0)}html[dir=rtl] .hero h1{letter-spacing:0}html[dir=rtl] .predict-line .pct{text-align:left}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding-top:35px}.panel{padding:17px}.navright{gap:6px}.navright .button{font-size:.85rem;padding:8px}}

<main class="shell"><section class="hero"><div class="eyebrow" data-i="eyebrow">LESSON 05 · LIGHTWEIGHT LAB</div><h1 data-i="title">How Does AI Find Information?</h1><p data-i="intro"></p></section><section class="layout"><div class="panel"><h2 data-i="step1"></h2><div class="field"><label for="documents" data-i="docLabel"></label><textarea class="input" id="documents" rows="10" maxlength="30000"></textarea><p class="tiny" data-i="linesNote"></p></div><div class="field"><label for="query" data-i="queryLabel"></label><input class="input" id="query" maxlength="400"></div><div class="row"><button class="button primary" id="search" data-i="searchButton"></button><button class="button" id="resetBtn" data-i="resetButton"></button></div></div><div class="panel"><h2 data-i="compareTitle"></h2><div class="stack"><section><div class="labelled" data-i="keywordTitle"></div><p class="tiny" data-i="keywordExplain"></p><div id="keywordResults" class="list"></div></section><div class="divider"></div><section><div class="labelled" data-i="conceptTitle"></div><p class="tiny" data-i="conceptExplain"></p><div id="conceptResults" class="list"></div></section></div></div></section><section class="panel"><h2 data-i="discoveryTitle"></h2><p data-i="challenge"></p><p class="notice" data-i="limits"></p></section></main><footer class="shell footer"><p data-i="caveat"></p><p><a href="../../">AI Learning Lab</a> · <a href="README.md">Lesson guide (English)</a> · <a href="README.ar.md">دليل الدرس</a></p></footer>
<script>const T={"en": {"eyebrow": "LESSON 05 · SEARCH FOR EVIDENCE", "title": "How Does AI Find Information?", "intro": "A prediction is not a verified fact. Give the app your own short document, ask any question and compare literal keyword search with a tiny concept-aware vector search.", "previous": "← Lesson 04", "next": "Lesson 06 →", "step1": "1. Build your document collection", "docLabel": "Document passages (one per line)", "linesNote": "Each line is a searchable passage. You can edit, add or remove lines.", "queryLabel": "Ask a question about the passages", "searchButton": "Find relevant passages", "resetButton": "Restore examples", "compareTitle": "2. Compare search methods", "keywordTitle": "Exact keyword overlap", "keywordExplain": "Looks for the same important words that appear in the question.", "conceptTitle": "Concept-aware vector matching", "conceptExplain": "Calculates cosine similarity between word-count vectors, using a tiny built-in dictionary of related words.", "discoveryTitle": "Experiment: same meaning, different words", "challenge": "Try “Where does the scientist work?” when the passage says “A researcher works in a laboratory.” Then replace the document with your own. Which search method helps more?", "limits": "The concept-aware comparison is a real numerical calculation, but NOT a pretrained embedding model or general semantic understanding. Its limited synonym dictionary is an educational aid and will not recognise every paraphrase. Retrieved passages are evidence; they are not generated answers.", "none": "No matching passage was found.", "score": "score", "line": "Passage", "caveat": "No external documents or AI providers are contacted. These results are computed from the text pupils enter."}, "ar": {"eyebrow": "الدرس ٠٥ · البحث عن الدليل", "title": "كيف يجد الذكاء الاصطناعي المعلومات؟", "intro": "التنبؤ بكلام محتمل لا يعني إثبات الحقيقة. أدخل نصاً من اختيارك واسأل أي سؤال وقارن البحث بالكلمات نفسها مع بحث متجهي بسيط يراعي بعض الكلمات المتقاربة.", "previous": "← الدرس ٠٤", "next": "الدرس ٠٦ →", "step1": "١. أنشئ مجموعة النصوص", "docLabel": "المقاطع النصية (سطر لكل مقطع)", "linesNote": "كل سطر مقطع قابل للبحث. يمكنك إضافة الأسطر أو تعديلها أو حذفها.", "queryLabel": "اسأل سؤالاً حول المقاطع", "searchButton": "ابحث عن المقاطع", "resetButton": "استعادة الأمثلة", "compareTitle": "٢. قارن طريقتَي البحث", "keywordTitle": "تطابق الكلمات المباشر", "keywordExplain": "يبحث عن الكلمات المهمة نفسها التي وردت في السؤال.", "conceptTitle": "بحث متجهي مع قاموس مفاهيم صغير", "conceptExplain": "يحسب تشابه جيب التمام بين متجهات عدد الكلمات، مع قاموس صغير للكلمات المتقاربة.", "discoveryTitle": "تجربة: المعنى نفسه بكلمات مختلفة", "challenge": "اسأل «أين يعمل العالم؟» عندما يكون النص «يعمل الباحث في المختبر». ثم اكتب نصاً خاصاً بك. أي طريقة بحث تساعد أكثر؟", "limits": "هذه مقارنة رقمية حقيقية لكنها ليست نموذج تضمين مدرّباً ولا فهماً دلالياً عاماً. قاموس الكلمات المتقاربة محدود ولن يتعرف إلى كل تعبير مختلف. المقاطع المسترجعة دليل وليست إجابات مولّدة.", "none": "لم يُعثر على مقطع مطابق.", "score": "الدرجة", "line": "المقطع", "caveat": "لا تتصل التجربة بمستندات خارجية أو مزوّدي ذكاء اصطناعي. تُحسب النتائج من النص الذي يدخله المتعلم."}};
const $=id=>document.getElementById(id);
const stop={en:new Set('the a an is are was were be been being and or to for of in on at with from this that it its i my your our you what where when how who which does do did can could should many much tell me about please in the'.split(' ')),ar:new Set('ما ماذا من أين متى كيف هل كم في على عن إلى الى و أو أن إن هو هي هذا هذه ذلك تلك التي الذي لدى عند عنده يكون تكون أريد لي لنا يا ثم مع عدد يوجد موجود'.split(' '))};
function toks(s){return (s.toLocaleLowerCase().normalize('NFKC').match(/[\p{L}\p{M}\p{N}]+(?:['’-][\p{L}\p{M}\p{N}]+)*/gu)||[])}
function norm(s){let w=s.toLocaleLowerCase().normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي');return w}
function useful(s){return toks(s).map(norm).filter(w=>w.length>1&&!new Set([...stop[lang]].map(norm)).has(w))}
function clean(str){return (str||'').replace(/\r/g,'').trim()}
function safeLines(s){return clean(s).split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,250)}
function addText(parent,tag,value,css){const e=document.createElement(tag);if(css)e.className=css;e.textContent=value;parent.append(e);return e}
function setStatus(id,msg){$(id).textContent=msg}
let lang='en';
function localize(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T[lang][el.dataset.i]??el.dataset.i});document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=T[lang][el.dataset.ph]??''})}
$('lang').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';localize();reset()});


const samples={en:{documents:'A researcher works in a laboratory and studies stars.\nA doctor helps patients at the hospital.\nThe school library opens at eight in the morning.\nCars and bicycles travel along the road.\nA small cat sleeps beside the window.',query:'Where does the scientist work?'},ar:{documents:'يعمل الباحث في المختبر ويدرس النجوم.\nيساعد الطبيب المرضى في المستشفى.\nتفتح مكتبة المدرسة في الثامنة صباحا.\nتسير السيارات والدراجات على الطريق.\nتنام قطة صغيرة بجانب النافذة.',query:'أين يعمل العالم؟'}};
const groups={en:[['scientist','researcher'],['laboratory','lab'],['doctor','physician'],['car','cars','automobile','vehicle'],['school','classroom'],['child','kid'],['open','opens','opening'],['study','studies'],['work','works','working'],['bike','bicycle','bicycles']],ar:[['عالم','الباحث','باحث'],['مختبر','معمل'],['طبيب','دكتور'],['سيارة','سيارات','مركبة'],['مدرسة','صف'],['طفل','ولد'],['يفتح','تفتح','افتتاح'],['يعمل','عمل']]};
function stem(s){let w=norm(s);return lang==='ar'&&w.startsWith('ال')&&w.length>4?w.slice(2):w}
function concept(w){const nw=stem(w);for(const [i,g] of groups[lang].entries()){if(g.some(s=>stem(s)===nw))return 'concept'+i}return nw}
function tokensFor(s,mode){return useful(s).map(s=>mode==='concept'?concept(s):stem(s))}
function cosine(a,b){const keys=new Set([...a.keys(),...b.keys()]);let dot=0,x=0,y=0;for(const k of keys){let q=a.get(k)||0,d=b.get(k)||0;dot+=q*d;x+=q*q;y+=d*d}return x&&y?dot/Math.sqrt(x*y):0}
function vector(tokens){let m=new Map();tokens.forEach(x=>m.set(x,(m.get(x)||0)+1));return m}
function searchMode(mode){const docs=safeLines($('documents').value),q=tokensFor($('query').value,mode),qset=new Set(q);return docs.map((s,i)=>{const w=tokensFor(s,mode),ws=new Set(w);let score=mode==='keyword'?q.length?q.filter(x=>ws.has(x)).length/q.length:0:cosine(vector(q),vector(w));return {s,i,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,4)}
function draw(id,results){const root=$(id);root.replaceChildren();if(!results.length){addText(root,'p',T[lang].none,'tiny');return}for(const r of results){const card=addText(root,'div','','result');const row=addText(card,'div','','row');addText(row,'b',T[lang].line+' '+(r.i+1));addText(row,'span',Math.round(r.score*100)+'%','pill');addText(card,'p',r.s,'muted')}}
function search(){draw('keywordResults',searchMode('keyword'));draw('conceptResults',searchMode('concept'))}
function reset(){ $('documents').value=samples[lang].documents;$('query').value=samples[lang].query;search() }
$('search').addEventListener('click',search);$('resetBtn').addEventListener('click',reset);$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});

localize();reset();</script></body></html>
