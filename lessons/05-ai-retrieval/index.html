lay:grid;gap:10px}.story .stepbox{min-height:90px}.progress{font-weight:800;color:#a8d3f5}.tag{font-size:.75rem;font-weight:850;letter-spacing:.05em;color:#adcfef;text-transform:uppercase}.focus{border-color:#59bea9!important}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.example{color:#e7f9ff;font-weight:700;font-size:1.1rem;unicode-bidi:plaintext}.flowline{padding:8px 15px;color:#91d5c8;font-size:1.3rem;text-align:center}.trail{border:1px solid #3b587d;border-radius:16px;padding:15px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:30px 0}.trail a{background:#1a3152;border:1px solid #456890;border-radius:11px;padding:10px;text-decoration:none;font-weight:700}.footer{margin-top:34px;padding:24px 0;border-top:1px solid #38506e;color:#aec7e3}.only-ar{display:none}html[lang=ar] .only-ar{display:inline}html[lang=ar] .only-en{display:none}.badge{background:#1c4660;padding:4px 9px;border-radius:999px;font-size:.75rem;color:#cef5ff}.teach{margin:10px 0;padding:12px 16px;background:#152d4a;border-radius:12px} .teach summary{cursor:pointer;font-weight:800}.field{display:block;font-weight:750;margin:12px 0 6px}.input{display:block;background:#07182e;border:1px solid #54749c;color:#f1f7ff;padding:12px;border-radius:12px;width:100%;max-width:100%}textarea.input{resize:vertical;min-height:85px}.number{font-size:1.75rem;font-weight:850;color:#85e4d0} .small{font-size:.88rem;color:#bad0ed}.del{min-height:36px}.mission{margin:14px 0;padding:16px;border:1px solid #416285;border-radius:15px;background:#172c46}@media(max-width:680px){.grid2{grid-template-columns:1fr}.nav{padding:9px 0}.panel{padding:16px}.hero{padding:28px 0 12px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../../">✦ AI Learning Lab</a><nav class="navlinks" aria-label="Lesson navigation"><a class="btn" href="../04-ai-context-memory/" id="prevNav">← Lesson 04</a><a class="btn" href="../06-digital-twin/" id="nextNav">Lesson 06 →</a><button class="btn" id="lang" type="button">العربية</button></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow" data-t="eyebrow"></span><h1 data-t="title"></h1><p data-t="intro"></p><p class="hint" data-t="honest"></p></section>
<section class="panel"><h2 data-t="one"></h2><p class="muted" data-t="oneText"></p><label class="field" for="task" data-t="taskLabel"></label><select id="task" class="input" style="max-width:440px"></select><div class="grid2" style="margin-top:14px"><div class="stepbox"><div class="tag" id="taskTag"></div><p class="example" id="request"></p><div class="tag" data-t="toolInfo"></div><p id="toolsList" class="small"></p></div><div class="stepbox focus" aria-live="polite"><div class="progress" id="progress"></div><h3 id="stageTitle"></h3><p id="stageDesc"></p><p id="stageEvidence" class="hint" hidden></p></div></div><div class="controls"><button class="btn" id="back" type="button" data-t="back"></button><button class="btn primary" id="advance" type="button" data-t="next"></button><button class="btn" id="restart" type="button" data-t="start"></button></div><p class="small" data-t="source"></p></section>
<section class="panel"><h2 data-t="two"></h2><p class="muted" data-t="twoText"></p><div class="controls"><button class="btn active" id="workflow" type="button" data-t="wf" aria-pressed="true"></button><button class="btn" id="agent" type="button" data-t="agent" aria-pressed="false"></button></div><p class="hint" id="comparisonIntro"></p><div class="story" id="comparisonSteps" aria-live="polite"></div><div class="controls"><button class="btn primary" id="nextLoop" type="button" data-t="next"></button><button class="btn" id="restartLoop" type="button" data-t="start"></button></div></section>
<section class="panel"><h2 data-t="three"></h2><p class="hint" data-t="discovery"></p><p class="muted" data-t="nextLesson"></p><details class="teach"><summary>👩‍🏫 Teacher / المعلم</summary><p data-t="teacher"></p></details></section><nav class="trail" aria-label="Lesson navigation"><a id="prevTrail" href="../04-ai-context-memory/">← Previous lesson</a><a href="../../" id="homeTrail">All lessons</a><a id="nextTrail" href="../06-digital-twin/">Next lesson →</a></nav></main><footer class="footer"><div class="wrap">AI Learning Lab · Free · Open source · <a href="README.md">English guide</a> · <a href="README.ar.md">الدليل العربي</a></div></footer><script>"use strict";const T={"en": {"eyebrow": "LESSON 05 · VISUAL STORY", "title": "How Does AI Use Tools and Work Towards a Goal?", "intro": "An assistant can write an answer. But what happens when it needs fresh information or a job takes several steps? Follow the same everyday request as a chatbot, a workflow and an agent.", "honest": "Guided demonstration — this page does not run a language model, search the web or contact real services. Every tool result below is an explicitly fictional example.", "one": "1 · The assistant needs some help", "oneText": "Choose a task, then reveal the steps. First understand the idea; later we introduce the technical words.", "taskLabel": "Choose a story", "start": "Start again", "next": "Next step →", "back": "← Previous step", "stepTitle": ["A person asks for help", "The model is given tool descriptions", "The model may request a tool", "The application executes the tool", "The result goes back to the model", "The model prepares a response"], "stepDesc": ["The assistant receives the person’s goal.", "The app describes each available tool. From training and its instructions, a tool-capable model has learned patterns for when to request one. It uses the question and tool descriptions to generate its next response.", "The model may produce a structured request naming the tool and its inputs. It can choose the wrong tool or inputs; the app must check. The model does not execute the tool itself.", "The application checks permissions and arguments, then runs the tool. Here we show a fictional outcome, not a live call.", "The application supplies the tool result to the model as new information.", "The model can use the supplied result to write an answer. It might be wrong, so important actions need checks."], "two": "2 · Who chooses the steps?", "twoText": "A workflow follows the steps designed in advance. An agent can choose some next steps based on results, then repeat until its goal is reached, a limit applies or a person must approve.", "wf": "Show workflow", "agent": "Show agent", "whoWorkflow": "Workflow: the application decides which step comes next. Even a workflow can have prewritten if/else branches.", "whoAgent": "Agent: a model chooses some of its next actions, examines results, and may request another tool. The following is a prepared illustration, not a running agent.", "loopLabel": "Decision loop", "three": "3 · What did we discover?", "discovery": "Tools let an AI application get information or act outside the model. A workflow follows predesigned steps; an agent can dynamically choose steps. Neither is always better. Real agents also need limits, permissions, stopping rules and human approval for sensitive actions.", "nextLesson": "Next: In Lesson 06, build a real conversational Digital Twin. It is a chatbot, not an autonomous booking or research agent.", "teacher": "Teacher notes: ask what changed between workflow and agent. Was the tool actually run here? Who should approve a purchase?", "home": "All lessons", "previous": "← Lesson 04", "nextNav": "Lesson 06 →", "toolInfo": "Available tools", "source": "Illustrative example; model selection and agent decisions were not executed."}, "ar": {"eyebrow": "الدرس ٠٥ · قصة مرئية", "title": "كيف يستخدم الذكاء الاصطناعي الأدوات ويعمل لتحقيق هدف؟", "intro": "يمكن للمساعد كتابة رد. ولكن ماذا يحدث إذا احتاج إلى معلومة جديدة أو تطلّبت المهمة عدة خطوات؟ اتبع الطلب نفسه مع روبوت محادثة وسير عمل ووكيل ذكاء اصطناعي.", "honest": "هذا شرح مصوّر فقط. لا تشغّل الصفحة نموذجاً لغوياً أو بحثاً على الإنترنت أو خدمات حقيقية. نتائج الأدوات المعروضة أمثلة خيالية واضحة.", "one": "١ · المساعد يحتاج إلى مساعدة", "oneText": "اختر موقفاً ثم اكشف الخطوات. افهم الفكرة أولاً ثم نتعلم المصطلحات.", "taskLabel": "اختر القصة", "start": "ابدأ من جديد", "next": "الخطوة التالية ←", "back": "→ الخطوة السابقة", "stepTitle": ["شخص يطلب المساعدة", "يُعرّف النموذج بالأدوات المتاحة", "قد يطلب النموذج أداة", "التطبيق يشغّل الأداة", "تعود النتيجة إلى النموذج", "يجهّز النموذج الرد"], "stepDesc": ["يستقبل المساعد هدف الشخص.", "يشرح التطبيق ما تفعله كل أداة. تعلّم النموذج من التدريب والتعليمات أنماط طلب الأدوات، ويستخدم السؤال والأوصاف ليكوّن رده التالي.", "قد ينتج النموذج طلباً منظماً يحدد الأداة ومدخلاتها. وقد يختار أداة خاطئة، لذا يتحقق التطبيق من الطلب. النموذج لا يشغّل الأداة بنفسه.", "يتحقق التطبيق من الإذن والمدخلات ثم يشغّل الأداة. النتيجة هنا خيالية وليست اتصالاً مباشراً.", "يعيد التطبيق نتيجة الأداة إلى النموذج كمعلومة جديدة.", "يستطيع النموذج صياغة رد اعتماداً على النتيجة. وقد يخطئ، لذا نحتاج إلى التحقق قبل الإجراءات المهمة."], "two": "٢ · من يختار الخطوة التالية؟", "twoText": "يتّبع سير العمل خطوات صُممت مسبقاً. أما الوكيل فيمكنه اختيار خطوات بناء على النتائج وتكرار العملية حتى يحقق الهدف أو يصل إلى حد معين أو يحتاج إلى موافقة شخص.", "wf": "اعرض سير العمل", "agent": "اعرض الوكيل", "whoWorkflow": "سير العمل: التطبيق يحدد الخطوة التالية مسبقاً، ويمكن أن يضم فروعاً شرطية مبرمجة.", "whoAgent": "الوكيل: يختار النموذج بعض أفعاله التالية، ويراجع النتائج، وقد يطلب أداة أخرى. هذه قصة معدّة مسبقاً وليست وكيلاً يعمل فعلاً.", "loopLabel": "حلقة القرار", "three": "٣ · ماذا اكتشفنا؟", "discovery": "تساعد الأدوات تطبيق الذكاء الاصطناعي في جلب المعلومات أو تنفيذ أعمال خارجه. سير العمل يتبع خطوات مصممة مسبقاً، أما الوكيل فيختار خطواته بصورة أكثر مرونة. كلاهما يحتاج إلى حدود وصلاحيات وموافقات عند الضرورة.", "nextLesson": "التالي: ستبني في الدرس ٠٦ توأماً رقمياً يتحدث فعلاً باستخدام نموذج لغوي. وهو روبوت محادثة، وليس وكيلاً مستقلاً للحجز والبحث.", "teacher": "للمعلم: اسأل ما الفرق بين خطوات سير العمل والوكيل، وهل شُغّلت الأداة فعلاً هنا؟ ومن يجب أن يوافق على عملية شراء؟", "home": "جميع الدروس", "previous": "→ الدرس ٠٤", "nextNav": "الدرس ٠٦ ←", "toolInfo": "الأدوات المتاحة", "source": "مثال توضيحي: لم ننفّذ اختياراً حقيقياً للنموذج أو قرارات الوكيل."}};const scenarios={"en": {"picnic": {"name": "Plan an outdoor day", "ask": "Will it rain tomorrow, and can we find an indoor alternative if it does?", "tool": "Weather forecast", "call": "forecast(place, date)", "result": "Example result: Rain is expected tomorrow.", "answer": "An assistant could suggest an indoor plan and, if permitted, search for suitable venues.", "loop": ["Decide: I need to check the weather.", "Act: Request a forecast.", "Check: The illustrative forecast says rain.", "Decide again: I need an indoor option.", "Act: Request a search for indoor places.", "Check: Compare options; ask about budget if needed.", "Stop: Offer a plan for the person to approve."], "workflow": ["Always check the weather.", "If rain is reported, show the predefined indoor-options step.", "Prepare the response in the fixed order."]}, "library": {"name": "Organise a library", "ask": "Help plan enough shelves for a collection of books.", "tool": "Library notes + calculator", "call": "read_notes() → calculate_shelves(book_count, capacity)", "result": "Example notes: 125 books, 20 per shelf; calculator returns 7 shelves.", "answer": "An assistant could recommend seven shelves, with enough capacity for 140 books.", "loop": ["Decide: I need the number of books and shelf capacity.", "Act: Read the library notes.", "Check: 125 books, 20 per shelf.", "Decide again: I need a calculation.", "Act: Request the calculator.", "Check: Seven whole shelves are required.", "Stop: Explain the result to the person."], "workflow": ["Always load the library notes.", "Always calculate the shelf count.", "Always show the result in the prepared format."]}}, "ar": {"picnic": {"name": "تخطيط يوم خارج المنزل", "ask": "هل ستمطر غداً؟ وهل يمكننا إيجاد مكان داخلي إذا حدث ذلك؟", "tool": "أداة توقع الطقس", "call": "forecast(place, date)", "result": "نتيجة توضيحية: من المتوقع هطول المطر غداً.", "answer": "يمكن للمساعد اقتراح نشاط داخلي ثم البحث عن أماكن مناسبة إذا كان مسموحاً له.", "loop": ["يقرر: أحتاج إلى توقع الطقس.", "ينفذ: يطلب خدمة الطقس.", "يراجع: النتيجة التوضيحية تشير إلى المطر.", "يقرر من جديد: أحتاج إلى خيار داخلي.", "ينفذ: يطلب البحث عن أماكن داخلية.", "يراجع: يقارن الخيارات وقد يسأل عن الميزانية.", "يتوقف: يقدّم خطة يراجعها الشخص قبل تنفيذها."], "workflow": ["يبدأ دائماً بفحص الطقس.", "إذا كانت النتيجة مطراً، ينتقل إلى فرع الأماكن الداخلية المُعدّ مسبقاً.", "يُكمل إعداد الرد وفق الخطوات المحددة."]}, "library": {"name": "تنظيم مكتبة", "ask": "ساعدني في معرفة عدد الأرفف اللازمة لمجموعة كتب.", "tool": "ملاحظات المكتبة + حاسبة", "call": "read_notes() → calculate_shelves(book_count, capacity)", "result": "ملاحظات توضيحية: ١٢٥ كتاباً و٢٠ كتاباً لكل رف؛ النتيجة ٧ أرفف.", "answer": "يمكن للمساعد اقتراح سبعة أرفف تتسع إلى ١٤٠ كتاباً.", "loop": ["يقرر: أحتاج إلى عدد الكتب وسعة الرف.", "ينفذ: يقرأ ملاحظات المكتبة.", "يراجع: ١٢٥ كتاباً، و٢٠ لكل رف.", "يقرر من جديد: أحتاج إلى حساب.", "ينفذ: يطلب الحاسبة.", "يراجع: نحتاج إلى ٧ أرفف كاملة.", "يتوقف: يشرح النتيجة للشخص."], "workflow": ["يقرأ ملاحظات المكتبة دائماً.", "يحسب الأرفف دائماً.", "يعرض النتيجة بالتنسيق المُعد مسبقاً."]}}}; const $=id=>document.getElementById(id);let language='en',scenario='picnic',stage=0,mode='workflow',loop=0;
function text(){return T[language]};function scenarioData(){return scenarios[language][scenario]}
function renderStage(){const t=text(),s=scenarioData();$('request').textContent=s.ask;$('taskTag').textContent=s.name;$('toolsList').textContent=s.tool+' · '+(language==='en'?'The application shares the tool descriptions with the model.':'يوفّر التطبيق أوصاف الأدوات للنموذج.');$('progress').textContent=(stage+1)+' / 6';$('stageTitle').textContent=t.stepTitle[stage];$('stageDesc').textContent=t.stepDesc[stage];$('stageEvidence').hidden=stage<2;$('stageEvidence').textContent=stage===2?s.call:stage===3?s.result:stage===4?s.result:stage===5?s.answer:'';$('back').disabled=stage===0;$('advance').disabled=stage===5}
function renderCompare(){const t=text(),s=scenarioData(),items=mode==='workflow'?s.workflow:s.loop;$('workflow').classList.toggle('active',mode==='workflow');$('agent').classList.toggle('active',mode==='agent');$('workflow').setAttribute('aria-pressed',String(mode==='workflow'));$('agent').setAttribute('aria-pressed',String(mode==='agent'));$('comparisonIntro').textContent=mode==='workflow'?t.whoWorkflow:t.whoAgent;const host=$('comparisonSteps');host.replaceChildren();items.slice(0,loop+1).forEach((line,i)=>{const card=document.createElement('div');card.className='stepbox'+(i===loop?' live':'');const label=document.createElement('span');label.className='tag';label.textContent=(mode==='agent'?(i===0||i===3?'🧠':i===1||i===4?'🛠️':'🔎'):'📋')+' '+(i+1);const p=document.createElement('p');p.textContent=line;card.append(label,p);host.append(card)});$('nextLoop').disabled=loop===items.length-1}
function renderLanguage(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('lang').textContent=language==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=text()[el.dataset.t]});$('prevNav').textContent=text().previous;$('nextNav').textContent=text().nextNav;$('prevTrail').textContent=text().previous;$('nextTrail').textContent=text().nextNav;$('homeTrail').textContent=text().home;$('task').replaceChildren();for(const [key,s] of Object.entries(scenarios[language])){const o=document.createElement('option');o.value=key;o.textContent=s.name;$('task').append(o)}$('task').value=scenario;renderStage();renderCompare()}
$('lang').onclick=()=>{language=language==='en'?'ar':'en';stage=0;loop=0;renderLanguage()};
$('task').onchange=()=>{scenario=$('task').value;stage=0;loop=0;renderStage();renderCompare()};
$('advance').onclick=()=>{stage=Math.min(5,stage+1);renderStage()};$('back').onclick=()=>{stage=Math.max(0,stage-1);renderStage()};$('restart').onclick=()=>{stage=0;renderStage()};
$('workflow').onclick=()=>{mode='workflow';loop=0;renderCompare()};$('agent').onclick=()=>{mode='agent';loop=0;renderCompare()};
$('nextLoop').onclick=()=>{loop=Math.min((mode==='workflow'?scenarioData().workflow:scenarioData().loop).length-1,loop+1);renderCompare()};$('restartLoop').onclick=()=>{loop=0;renderCompare()};renderLanguage();</script></body></html>
