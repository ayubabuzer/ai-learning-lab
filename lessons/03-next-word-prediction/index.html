rflow:hidden;clip:rect(0,0,0,0)}html[dir=rtl] .hero h1{letter-spacing:0}html[dir=rtl] .predict-line .pct{text-align:left}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding-top:35px}.panel{padding:17px}.navright{gap:6px}.navright .button{font-size:.85rem;padding:8px}}

<main class="shell"><section class="hero"><div class="eyebrow" data-i="eyebrow">LESSON 03 · LIGHTWEIGHT LAB</div><h1 data-i="title">How Does AI Predict What Comes Next?</h1><p data-i="intro"></p></section><section class="layout">
<div class="panel"><h2 data-i="step1">1. Teach the mini AI with text</h2><p class="muted" data-i="books"></p><div class="field"><label for="training" data-i="trainLabel"></label><textarea class="input" id="training" rows="9" maxlength="12000"></textarea></div><div class="row"><button class="button primary" id="train" data-i="trainButton"></button><button class="button" id="restore" data-i="restoreButton"></button></div><p class="tiny" id="trainedStatus" role="status"></p></div>
<div class="panel"><h2 data-i="step2">2. Ask it to predict</h2><div class="field"><label for="starter" data-i="promptLabel"></label><input id="starter" class="input" maxlength="280" autocomplete="off"></div><div class="row"><button class="button primary" id="predict" data-i="predictButton"></button><button class="button" id="continue" data-i="continueButton"></button></div><p class="tiny" id="matchInfo"></p><div class="prediction" id="results" aria-live="polite"></div><div class="divider"></div><h2 data-i="sourceTitle"></h2><div class="list" id="evidence"></div></div></section>
<section class="panel"><h2 data-i="discoverTitle"></h2><div class="rules"><div class="rule"><b>1</b><span data-i="challenge1"></span></div><div class="rule"><b>2</b><span data-i="challenge2"></span></div><div class="rule"><b>3</b><span data-i="challenge3"></span></div></div><p class="notice" data-i="method"></p></section></main><footer class="shell footer"><p data-i="caveat"></p><p><a href="../../">AI Learning Lab</a> · <a href="README.md">Lesson guide (English)</a> · <a href="README.ar.md">دليل الدرس</a></p></footer>
<script>const T={"en": {"eyebrow": "LESSON 03 · PATTERN PREDICTION", "title": "How Does AI Predict What Comes Next?", "intro": "Real language models learn patterns from many examples of words and sentences in books, websites, stories, articles and other written text. Here you can teach a tiny model using your own examples, then see its next-word predictions.", "previous": "← Lesson 02", "next": "Lesson 04 →", "step1": "1. Teach the mini AI with text", "books": "Each line is an example. Click “Teach the mini AI” to rebuild what it has learned. Repeated examples have more influence.", "trainLabel": "Example sentences (edit freely)", "trainButton": "Teach the mini AI", "restoreButton": "Restore examples", "step2": "2. Predict the next word", "promptLabel": "Sentence starter", "predictButton": "Predict", "continueButton": "Add top prediction", "sourceTitle": "Which examples influenced it?", "discoverTitle": "Try these prediction experiments", "challenge1": "Add one more “The cat drinks water” sentence and teach it again. Do the percentages change?", "challenge2": "Try “The cat eats” instead of “The cat drinks”. Why does context matter?", "challenge3": "Write your own little collection of sentences. Can a classmate predict the mini AI’s favourite next word?", "method": "This is a real word-pattern counting calculation, not a trained Qwen model. The percentages come only from the editable example sentences. Real LLMs use far more text, longer context and complex networks; their training does not happen just by pasting text into a chat.", "caveat": "No model downloads, accounts or API keys. Predictions are from the example text on this page, not from websites searched live.", "status": "Mini AI learned {n} example sentences. Ready!", "dirty": "Examples changed — press Teach the mini AI to use the new text.", "missing": "No matching pattern. Add a sentence containing this starter and teach the mini AI.", "nothing": "Type a sentence starter first.", "matched": "Used {n} occurrences after a matching {k}-word context.", "source": "Example {n}", "unknown": "No supporting examples yet."}, "ar": {"eyebrow": "الدرس ٠٣ · التنبؤ بالأنماط", "title": "كيف يتنبأ الذكاء الاصطناعي بما يأتي؟", "intro": "تتعلّم النماذج اللغوية الحقيقية أنماطاً من أمثلة كثيرة من الكلمات والجمل في الكتب والمواقع الإلكترونية والقصص والمقالات وغيرها من النصوص. هنا يمكنك تعليم نموذج صغير بأمثلتك ومشاهدة توقعاته للكلمة التالية.", "previous": "← الدرس ٠٢", "next": "الدرس ٠٤ →", "step1": "١. علّم النموذج الصغير باستخدام النص", "books": "كل سطر مثال. اضغط «علّم النموذج» لإعادة حساب ما تعلّمه. الأمثلة المكررة تؤثر أكثر.", "trainLabel": "جمل الأمثلة (يمكنك تعديلها)", "trainButton": "علّم النموذج", "restoreButton": "استعادة الأمثلة", "step2": "٢. توقّع الكلمة التالية", "promptLabel": "بداية الجملة", "predictButton": "توقّع", "continueButton": "أضف التوقع الأول", "sourceTitle": "أي الأمثلة أثّرت في التوقع؟", "discoverTitle": "جرّب هذه الأنشطة", "challenge1": "أضف جملة أخرى «القطة تشرب الماء» ثم علّم النموذج من جديد. هل تتغير النسب؟", "challenge2": "جرّب «القطة تأكل» بدلاً من «القطة تشرب». لماذا يهم السياق؟", "challenge3": "اكتب مجموعة جمل خاصة بك. هل يستطيع زميلك توقّع الكلمة التي سيرجّحها النموذج؟", "method": "هذا حساب حقيقي يعتمد على عدّ أنماط الكلمات، وليس نموذج Qwen مدرّباً. تأتي النسب من جمل الأمثلة فقط. تتعلم النماذج اللغوية الكبيرة من نصوص أكثر بكثير وبأساليب أعقد؛ ولصق نص داخل المحادثة لا يعني إعادة تدريبها.", "caveat": "لا يحتاج إلى تنزيل نموذج أو حساب أو مفتاح API. يعتمد التوقع على أمثلة هذه الصفحة، ولا يبحث مباشرة في الإنترنت.", "status": "تعلّم النموذج من {n} جمل. جاهز!", "dirty": "تغيّرت الأمثلة — اضغط «علّم النموذج» لتطبيق التغيير.", "missing": "لم يُعثر على نمط مطابق. أضف جملة تحتوي هذه البداية ثم علّم النموذج.", "nothing": "اكتب بداية جملة أولاً.", "matched": "استُخدمت {n} حالات مطابقة لسياق من {k} كلمات.", "source": "المثال {n}", "unknown": "لا توجد أمثلة داعمة بعد."}};
const $=id=>document.getElementById(id);
const stop={en:new Set('the a an is are was were be been being and or to for of in on at with from this that it its i my your our you what where when how who which does do did can could should many much tell me about please in the'.split(' ')),ar:new Set('ما ماذا من أين متى كيف هل كم في على عن إلى الى و أو أن إن هو هي هذا هذه ذلك تلك التي الذي لدى عند عنده يكون تكون أريد لي لنا يا ثم مع عدد يوجد موجود'.split(' '))};
function toks(s){return (s.toLocaleLowerCase().normalize('NFKC').match(/[\p{L}\p{M}\p{N}]+(?:['’-][\p{L}\p{M}\p{N}]+)*/gu)||[])}
function norm(s){let w=s.toLocaleLowerCase().normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي');return w}
function useful(s){return toks(s).map(norm).filter(w=>w.length>1&&!new Set([...stop[lang]].map(norm)).has(w))}
function clean(str){return (str||'').replace(/\r/g,'').trim()}
function safeLines(s){return clean(s).split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,250)}
function addText(parent,tag,value,css){const e=document.createElement(tag);if(css)e.className=css;e.textContent=value;parent.append(e);return e}
function setStatus(id,msg){$(id).textContent=msg}
let lang='en';
function localize(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T[lang][el.dataset.i]??el.dataset.i});document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=T[lang][el.dataset.ph]??''})}
$('lang').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';localize();reset()});


const samples={en:{training:'The cat drinks milk.\nThe cat drinks water.\nThe cat drinks milk.\nThe dog drinks water.\nThe cat eats fish.\nThe bird eats seeds.\nThe cat sleeps in a basket.',starter:'The cat drinks'},ar:{training:'القطة تشرب الحليب.\nالقطة تشرب الماء.\nالقطة تشرب الحليب.\nالكلب يشرب الماء.\nالقطة تأكل السمك.\nالعصفور يأكل الحبوب.\nالقطة تنام في السلة.',starter:'القطة تشرب'}};
let learned=[],last=[];const patterns=line=>(line.match(/[\p{L}\p{M}\p{N}]+/gu)||[]).map(x=>x.toLocaleLowerCase());
function train(){learned=safeLines($('training').value).map((s,i)=>({raw:s,i,t:patterns(s)}));setStatus('trainedStatus',T[lang].status.replace('{n}',learned.length));predict()}
function candidates(){const prefix=patterns($('starter').value);if(!prefix.length)return {list:[],k:0,n:0};let matches=[];let k=0;for(let size=Math.min(4,prefix.length);size>=1;size--){let result=[];learned.forEach(line=>{for(let i=0;i+size<line.t.length;i++){if(prefix.slice(-size).every((token,j)=>token===line.t[i+j]))result.push({next:line.t[i+size],line})}});if(result.length){matches=result;k=size;break}}return {list:matches,k,n:matches.length}}
function predict(){const {list,k,n}=candidates(),box=$('results'),sources=$('evidence');box.replaceChildren();sources.replaceChildren();last=[];if(!patterns($('starter').value).length){setStatus('matchInfo',T[lang].nothing);return}if(!n){setStatus('matchInfo',T[lang].missing);return}setStatus('matchInfo',T[lang].matched.replace('{n}',n).replace('{k}',k));const counts=new Map();list.forEach(item=>counts.set(item.next,(counts.get(item.next)||0)+1));last=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],lang));for(let [word,num] of last){const row=document.createElement('div');row.className='predict-line';addText(row,'b',word);const track=addText(row,'div','', 'bar');const fill=document.createElement('div');fill.className='barfill';fill.style.width=(num/n*100).toFixed(3)+'%';track.append(fill);addText(row,'span',(num/n*100).toFixed(1)+'%','pct');box.append(row)}const seen=new Set();for(const {line} of list){if(seen.has(line.i))continue;seen.add(line.i);addText(sources,'div',T[lang].source.replace('{n}',line.i+1)+': '+line.raw,'quote')}
}
function reset(){ $('training').value=samples[lang].training;$('starter').value=samples[lang].starter;train() }
$('train').addEventListener('click',train);$('training').addEventListener('input',()=>setStatus('trainedStatus',T[lang].dirty));$('restore').addEventListener('click',reset);$('predict').addEventListener('click',predict);$('continue').addEventListener('click',()=>{if(!last.length)return;$('starter').value=$('starter').value.trim()+' '+last[0][0];predict()});$('starter').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();predict()}});

localize();reset();</script></body></html>
