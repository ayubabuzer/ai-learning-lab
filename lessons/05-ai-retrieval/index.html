en:{eyebrow:'LESSON 05 · INSIDE ATTENTION',title:'How Does AI Know Which Words to Look At?',intro:'Why can one changed word change a connection? Try small versus big, click “it”, then write your own sentence and watch the weights recalculate.',bigIdea:'AI learns numerical patterns while training. When it reads a sentence, attention calculations help its words exchange information.',inputRole:'✍️ Your sentence',yourSentence:'Write or change the sentence',inputHelp:'Write any short sentence. The special ball/bag example has a clear teaching rule; other sentences still get recalculated numbers, but not guaranteed meaning.',sizeSmall:'⚽ Try too small',sizeBig:'🎒 Change to too big',sample1:'Try ball and bag',sample2:'Try a different sentence',explore:'🤖 Explore attention',reset:'Reset',settingsRole:'⚙️ Explorer settings',settingsTitle:'Choose what the mini calculator notices',lensLabel:'Choose a teaching pattern',lensClues:'Meaning clue (teaching rule)',lensPattern:'Similar-looking words',lensNearby:'Nearby words',lensHelp:'The size-clue rule applies only to matching fit-in sentences. Other sentences use a general numerical pattern. These are not trained attention heads.',howTitle:'How does AI do this?',howSimple:'Real AI learns numerical settings from many texts. Our mini calculator uses simple preset matching rules and turns its scores into percentages. It is a demonstration, not trained AI.',outputRole:'🤖 Attention explorer',outputTitle:'Connections and attention scores',waiting:'🤖 Your connection map will appear here after you click Explore attention.',clickWord:'Click any word to explore its connections. Edit your sentence and the numbers update.',chartHelp:'Thicker lines mean larger computed weights in this classroom example. They do not prove a word’s meaning or show trained-model attention.',numberMeaningTitle:'What do these numbers show?',numberMeaning:'',takeawayTitle:'Try it like a scientist',takeaway:'First compare too small and too big: which word gets the larger weight from “it”? Then try your own sentence. The calculator always computes weights, but cannot reliably interpret every sentence.',honesty:'Important: The small/big example uses a deliberately programmed classroom clue rule. Other sentences use generic numerical patterns. All percentages are computed, but none are attention weights from a trained language model or confidence that an answer is correct.',teacherTitle:'👩‍🏫 15-minute classroom activity',teacherSteps:['Open the ball/bag sentence and choose “it”; compare “too small” with “too big”.','Point to the two changing weights, and explain that we programmed the classroom rule.','Have pupils type their own sentence and click another word; the calculation always updates.','Ask: Do these numbers prove the meaning? Why is a trained AI model different?'],samples:["The ball didn't fit in the bag because it was too small.",'The robot carried the blue book to school.'],selected:'Selected word',percentHelp:'The bars are calculated weights: this selected word divides 100% across the visible text pieces. These are not confidence scores or proof of what “it” refers to.',limit:'For a readable graph, this explorer uses up to 18 word or punctuation pieces.',noWords:'Enter a sentence with words.',thinking:'Calculating connections…',compareTitle:'Watch one word change the weights',compareIntro:'A classroom rule compares “it” with the two object words. Both columns use calculated weights from the same sentence with different size clues.',compareCaution:'We wrote this size rule for teaching. A real model learns attention settings from training; its weights need not match these numbers.',clueActive:'The size-clue classroom rule is active for “it”.',clueGeneral:'Using a general word/position calculator. It works with any sentence, but does not know what a pronoun really refers to.',clueSmall:'too small',clueBig:'too big'},

function tokensOf(s){return (s.match(/[\p{L}\p{M}\p{N}]+(?:[’'][\p{L}\p{M}\p{N}]+)*|[^\s]/gu)||[]).slice(0,18)}
// Word-pattern head: small numeric vectors made from each word's characters.
// Neighbour head: fixed query/key vectors whose dot product favours adjacent positions.
// Both are genuine softmax computations, but the vectors are deliberately NOT pretrained.
function wordVec(s){const a=Array(8).fill(0);const chars=[...s.toLocaleLowerCase()];for(let k=0;k<chars.length;k++){const cp=chars[k].codePointAt(0);let h=((cp*1315423911)^(cp>>>3))>>>0;a[h%8]+=1;if(k){const prev=chars[k-1].codePointAt(0);h=(((prev*31)^(cp*131))>>>0);a[h%8]+=.6}}const norm=Math.hypot(...a)||1;return a.map(x=>x/norm)}
function softmax(arr){const m=Math.max(...arr),xs=arr.map(n=>Math.exp(n-m)),sum=xs.reduce((a,b)=>a+b,0);return xs.map(x=>x/sum)}
// The classroom size rule is deliberately authored, NOT learned by a model.
// It works with suitable "X didn't fit in Y because it was too small/big" examples.
// For other teacher-written sentences, we still calculate general numerical weights.
function sizeInfo(parts){
 const t=parts.map(x=>x.toLocaleLowerCase());
 const fit=t.indexOf('fit'),inPos=t.indexOf('in',fit+1),because=t.indexOf('because',inPos+1),it=t.indexOf('it',because+1);
 if(fit>1&&inPos>fit&&because>inPos&&it>because&&t.includes('too')&&(t.includes('small')||t.includes('big'))){
  const ignore=new Set(['the','a','an','didn\'t','couldn\'t','did','not','cannot','could','wouldn\'t']);
  const before=t.findIndex((x,i)=>i<fit&&!ignore.has(x)&&/^[a-z]+$/i.test(x));
  const after=t.findIndex((x,i)=>i>inPos&&i<because&&!ignore.has(x)&&/^[a-z]+$/i.test(x));
  const clue=t.includes('small')?'small':'big';
  if(before>=0&&after>=0&&before!==after)return {first:before,second:after,pronoun:it,clue,language:'en'};
 }
 const pre=t.indexOf('في'),pron=t.indexOf('لأنها',pre+1);
 if(pre>0&&pron>pre&&t.includes('لم')&&(t.includes('صغيرة')||t.includes('كبيرة'))){
  const before=t.findIndex((x,i)=>i<pre&&!new Set(['لم','تدخل','لمّا']).has(x));
  const after=t.findIndex((x,i)=>i>pre&&i<pron&&/\p{L}/u.test(x));
  if(before>=0&&after>=0&&before!==after)return {first:before,second:after,pronoun:pron,clue:t.includes('صغيرة')?'small':'big',language:'ar'};
 }
 return null;
}
function clueWeights(parts,info,clue){
 const base=parts.map((w,j)=>-1.5-0.045*Math.abs(info.pronoun-j)+0.12*wordVec(parts[info.pronoun]).reduce((sum,x,k)=>sum+x*wordVec(w)[k],0));
 base[info.pronoun]=-.25;
 base[info.first]=clue==='big'?3.7:.8;
 base[info.second]=clue==='small'?3.7:.8;
 return {scores:base,weights:softmax(base)};
}
function compute(parts,index,lens){
 const info=sizeInfo(parts);
 if(lens==='clues'&&info&&index===info.pronoun)return {...clueWeights(parts,info,info.clue),sizeRule:info};
 let scores;
 if(lens==='nearby'){
  const q=[-index*index*.25,index*.5,.25],d=Math.sqrt(3);
  scores=parts.map((_,j)=>{const k=[1,j,-j*j];return q.reduce((s,x,i)=>s+x*k[i],0)/d});
 }else{
  const q=wordVec(parts[index]);
  // For arbitrary text, this compares character-based vectors and, in clue mode,

}
function renderSizeCompare(parts,info){
 const host=$('sizeComparison'),bars=$('compareBars'),t=I[lang];
 if(!info){host.hidden=true;bars.replaceChildren();return;}
 host.hidden=false;bars.replaceChildren();

  const weights=clueWeights(parts,info,clue).weights;
  const col=document.createElement('div');col.className='mini'+(info.clue===clue?' active':'');

  for(const idx of [info.first,info.second]){

function calculate(){const parts=tokensOf($('sentence').value);const t=I[lang];if(!parts.length){$('sizeComparison').hidden=true;$('results').hidden=true;$('waiting').hidden=false;$('waiting').textContent=t.noWords;return}selected=Math.max(0,Math.min(selected,parts.length-1));const {weights,sizeRule}=compute(parts,selected,$('lens').value);$('clueStatus').textContent=sizeRule?t.clueActive:t.clueGeneral;renderSizeCompare(parts,sizeRule);$('waiting').hidden=true;$('results').hidden=false;$('words').replaceChildren();parts.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='word'+(i===selected?' selected':'');b.textContent=w;b.setAttribute('aria-pressed',String(i===selected));b.addEventListener('click',()=>{selected=i;calculate()});$('words').append(b)});$('selectedLabel').textContent=t.selected+': '+parts[selected]+' · '+parts.length+' '+(lang==='ar'?'أجزاء':'pieces')+'. '+t.limit;graph(parts,weights);$('weights').replaceChildren();parts.forEach((w,i)=>{const box=document.createElement('div');box.className='weight';const label=document.createElement('div');label.className='weightline';const name=document.createElement('span');name.textContent=(i+1)+'. '+w;const val=document.createElement('b');val.textContent=(100*weights[i]).toFixed(1)+'%';label.append(name,val);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=weights[i]*100+'%';track.append(fill);box.append(label,track);$('weights').append(box)});$('numberMeaning').textContent=t.percentHelp}
