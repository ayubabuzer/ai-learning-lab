<main class="shell"><section class="hero"><div class="eyebrow" data-i="eyebrow">LESSON 04 · LIGHTWEIGHT LAB</div><h1 data-i="title">Does AI Really Remember?</h1><p data-i="intro"></p></section><section class="layout"><div class="panel"><h2 data-i="step1"></h2><p class="tiny" data-i="sessionNote"></p><div class="field"><label for="context" data-i="contextLabel"></label><textarea class="input" id="context" rows="9" maxlength="20000"></textarea></div><label class="check"><input type="checkbox" id="include" checked><span data-i="include"></span></label><div class="field"><label for="question" data-i="questionLabel"></label><input class="input" id="question" maxlength="400" autocomplete="off"></div><div class="row"><button class="button primary" id="ask" data-i="askButton"></button><button class="button" id="fresh" data-i="freshButton"></button></div></div><div class="panel"><h2 data-i="resultTitle"></h2><div class="result" id="answer" aria-live="polite"></div><h2 style="margin-top:24px" data-i="visibleTitle"></h2><div class="result" style="white-space:pre-wrap" id="received"></div><h2 style="margin-top:24px" data-i="historyTitle"></h2><div class="list" id="history"></div></div></section><section class="panel"><h2 data-i="noticeTitle"></h2><p data-i="noticeBody"></p><p class="notice" data-i="limitation"></p></section></main><footer class="shell footer"><p data-i="caveat"></p><p><a href="../../">AI Learning Lab</a> · <a href="README.md">Lesson guide (English)</a> · <a href="README.ar.md">دليل الدرس</a></p></footer>
<script>const T={"en": {"eyebrow": "LESSON 04 · TEMPORARY CONTEXT", "title": "Does AI Really Remember?", "intro": "Give the mini reader any fictional facts and ask your own question. Turn the context on or off and start a fresh session to discover what an app can “remember”.", "previous": "← Lesson 03", "next": "Lesson 05 →", "step1": "1. Add some information", "sessionNote": "Nothing on this page trains a model or saves your facts to a server.", "contextLabel": "Your knowledge text", "include": "Include this text with my question", "questionLabel": "Ask any question about the text", "askButton": "Ask the mini reader", "freshButton": "Start a fresh session", "resultTitle": "What could it find?", "visibleTitle": "Exactly what the reader receives", "historyTitle": "This session’s questions", "noticeTitle": "What counts as memory?", "noticeBody": "Model weights are learned during training. A conversation can include temporary context. An application may separately store information and send it again later. These are different things.", "limitation": "This lightweight reader does not use a language model. It finds relevant sentences using matching words, and it may fail to answer rephrased questions. A real LLM could generate answers, but providing context would still not retrain the model.", "noEvidence": "I don’t know from the text provided.", "evidence": "Relevant sentence found in the supplied text:", "off": "Context is OFF. No knowledge text was supplied.", "questionEmpty": "Write a question first.", "sent": "Context included:", "question": "Question:", "none": "None", "fresh": "Fresh session — no history and no saved facts.", "youAsked": "You asked:", "receivedContext": "No knowledge text supplied.", "saved": "Questions in this tab only; nothing is saved after a fresh session."}, "ar": {"eyebrow": "الدرس ٠٤ · السياق المؤقت", "title": "هل يتذكر الذكاء الاصطناعي حقاً؟", "intro": "قدّم للقارئ الصغير أي معلومات خيالية واسأل سؤالاً من اختيارك. شغّل السياق أو أوقفه وابدأ جلسة جديدة لتكتشف الفرق بين السياق والذاكرة.", "previous": "← الدرس ٠٣", "next": "الدرس ٠٥ →", "step1": "١. أضف معلومات", "sessionNote": "لا تدرّب هذه الصفحة أي نموذج ولا ترسل معلوماتك إلى خادم.", "contextLabel": "النص المعرفي", "include": "أرسل هذا النص مع سؤالي", "questionLabel": "اسأل أي سؤال حول النص", "askButton": "اسأل القارئ الصغير", "freshButton": "ابدأ جلسة جديدة", "resultTitle": "ماذا استطاع إيجاده؟", "visibleTitle": "ماذا يستقبل القارئ بالضبط؟", "historyTitle": "أسئلة هذه الجلسة", "noticeTitle": "ما المقصود بالذاكرة؟", "noticeBody": "تتكوّن أوزان النموذج أثناء التدريب. وقد تتضمّن المحادثة سياقاً مؤقتاً. ويمكن للتطبيق أن يحفظ معلومات بشكل منفصل ويرسلها لاحقاً. هذه أشياء مختلفة.", "limitation": "هذا قارئ خفيف وليس نموذجاً لغوياً. يعثر على جمل ملائمة من خلال الكلمات المشتركة وقد لا ينجح في فهم الأسئلة المعاد صياغتها. يمكن للنموذج اللغوي الحقيقي توليد إجابات، لكن إعطاء السياق لا يعيد تدريبه.", "noEvidence": "لا أعرف الإجابة من النص المتاح.", "evidence": "وجدت جملة مرتبطة في النص:", "off": "السياق متوقف. لم يُرسَل النص المعرفي.", "questionEmpty": "اكتب سؤالاً أولاً.", "sent": "النص المرسَل:", "question": "السؤال:", "none": "لا شيء", "fresh": "جلسة جديدة — دون أسئلة سابقة أو معلومات محفوظة.", "youAsked": "سألت:", "receivedContext": "لم يُرسَل نص معرفي.", "saved": "الأسئلة في علامة التبويب فقط؛ لا تُحفظ بعد بدء جلسة جديدة."}};
const $=id=>document.getElementById(id);
const stop={en:new Set('the a an is are was were be been being and or to for of in on at with from this that it its i my your our you what where when how who which does do did can could should many much tell me about please in the'.split(' ')),ar:new Set('ما ماذا من أين متى كيف هل كم في على عن إلى الى و أو أن إن هو هي هذا هذه ذلك تلك التي الذي لدى عند عنده يكون تكون أريد لي لنا يا ثم مع عدد يوجد موجود'.split(' '))};
function toks(s){return (s.toLocaleLowerCase().normalize('NFKC').match(/[\p{L}\p{M}\p{N}]+(?:['’-][\p{L}\p{M}\p{N}]+)*/gu)||[])}
function norm(s){let w=s.toLocaleLowerCase().normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي');return w}
function useful(s){return toks(s).map(norm).filter(w=>w.length>1&&!new Set([...stop[lang]].map(norm)).has(w))}
function clean(str){return (str||'').replace(/\r/g,'').trim()}
function safeLines(s){return clean(s).split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,250)}
function addText(parent,tag,value,css){const e=document.createElement(tag);if(css)e.className=css;e.textContent=value;parent.append(e);return e}
function setStatus(id,msg){$(id).textContent=msg}
let lang='en';
function localize(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T[lang][el.dataset.i]??el.dataset.i});document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=T[lang][el.dataset.ph]??''})}
$('lang').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';localize();reset()});


const samples={en:{context:'Nova is an imaginary planet with three moons.\nThe explorers on Nova eat purple apples.\nThe capital of Nova is Star City.',question:'How many moons does Nova have?'},ar:{context:'نوفا كوكب خيالي له ثلاثة أقمار.\nيأكل المستكشفون في نوفا تفاحاً أرجوانياً.\nعاصمة نوفا هي مدينة النجوم.',question:'كم قمراً لكوكب نوفا؟'}};
let history=[];function chunks(text){return clean(text).split(/[\n.!?؟]+/).map(x=>x.trim()).filter(Boolean)}
function matching(q,ctx){const qt=[...new Set(useful(q))];if(!qt.length)return null;const options=chunks(ctx).map((line,i)=>{const w=new Set(useful(line));const hits=qt.filter(x=>w.has(x)).length;return {line,i,hits}}).sort((a,b)=>b.hits-a.hits);return options[0]?.hits?options[0]:null}
function showHistory(){const h=$('history');h.replaceChildren();for(const item of history.slice().reverse()){addText(h,'div',T[lang].youAsked+' '+item,'quote')}if(!history.length)addText(h,'span',T[lang].saved,'tiny')}
function ask(){let question=clean($('question').value);if(!question){setStatus('answer',T[lang].questionEmpty);return}const include=$('include').checked;const ctx=include?clean($('context').value):'';setStatus('received',T[lang].sent+'\n'+(ctx||T[lang].none)+'\n\n'+T[lang].question+' '+question);let match=matching(question,ctx);setStatus('answer',!include?T[lang].off:match?T[lang].evidence+'\n“'+match.line+'”':T[lang].noEvidence);history.push(question);showHistory()}
function reset(){history=[];$('context').value=samples[lang].context;$('question').value=samples[lang].question;$('include').checked=true;setStatus('received',T[lang].receivedContext);setStatus('answer',T[lang].fresh);showHistory()}
function freshSession(){history=[];$('context').value='';$('question').value='';$('include').checked=false;setStatus('received',T[lang].receivedContext);setStatus('answer',T[lang].fresh);showHistory()}
$('ask').addEventListener('click',ask);$('fresh').addEventListener('click',freshSession);$('include').addEventListener('change',()=>{setStatus('received',T[lang].receivedContext)});

localize();reset();</script></body></html>
