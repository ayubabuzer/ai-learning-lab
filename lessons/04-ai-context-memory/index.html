lay:grid;gap:10px}.story .stepbox{min-height:90px}.progress{font-weight:800;color:#a8d3f5}.tag{font-size:.75rem;font-weight:850;letter-spacing:.05em;color:#adcfef;text-transform:uppercase}.focus{border-color:#59bea9!important}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.example{color:#e7f9ff;font-weight:700;font-size:1.1rem;unicode-bidi:plaintext}.flowline{padding:8px 15px;color:#91d5c8;font-size:1.3rem;text-align:center}.trail{border:1px solid #3b587d;border-radius:16px;padding:15px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:30px 0}.trail a{background:#1a3152;border:1px solid #456890;border-radius:11px;padding:10px;text-decoration:none;font-weight:700}.footer{margin-top:34px;padding:24px 0;border-top:1px solid #38506e;color:#aec7e3}.only-ar{display:none}html[lang=ar] .only-ar{display:inline}html[lang=ar] .only-en{display:none}.badge{background:#1c4660;padding:4px 9px;border-radius:999px;font-size:.75rem;color:#cef5ff}.teach{margin:10px 0;padding:12px 16px;background:#152d4a;border-radius:12px} .teach summary{cursor:pointer;font-weight:800}.field{display:block;font-weight:750;margin:12px 0 6px}.input{display:block;background:#07182e;border:1px solid #54749c;color:#f1f7ff;padding:12px;border-radius:12px;width:100%;max-width:100%}textarea.input{resize:vertical;min-height:85px}.number{font-size:1.75rem;font-weight:850;color:#85e4d0} .small{font-size:.88rem;color:#bad0ed}.del{min-height:36px}.mission{margin:14px 0;padding:16px;border:1px solid #416285;border-radius:15px;background:#172c46}@media(max-width:680px){.grid2{grid-template-columns:1fr}.nav{padding:9px 0}.panel{padding:16px}.hero{padding:28px 0 12px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../../">✦ AI Learning Lab</a><nav class="navlinks" aria-label="Lesson navigation"><a class="btn" href="../03-next-word-prediction/" id="prevNav">← Lesson 04</a><a class="btn" href="../05-ai-retrieval/" id="nextNav">Lesson 06 →</a><button class="btn" id="lang" type="button">العربية</button></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow" data-t="eyebrow"></span><h1 data-t="title"></h1><p data-t="intro"></p><p class="hint" data-t="honest"></p></section>
<section class="panel"><h2 data-t="one"></h2><p class="muted" data-t="startHint"></p><div class="grid2"><div><label class="field" for="role" data-t="role"></label><select id="role" class="input"><option value="user" data-t="your"></option><option value="assistant" data-t="assistant"></option></select></div><div><label class="field" for="message" data-t="message"></label><textarea id="message" class="input" maxlength="600" rows="2"></textarea></div></div><div class="controls"><button class="btn primary" id="add" data-t="add" type="button"></button><button class="btn" id="reset" data-t="reset" type="button"></button><button class="btn" id="clear" data-t="clear" type="button"></button></div><div class="story" id="messages" style="margin-top:16px" aria-live="polite"></div></section>
<section class="panel"><h2 data-t="two"></h2><div class="grid2"><div class="stepbox"><label class="row"><input id="include" type="checkbox" checked style="width:20px;height:20px"><strong data-t="sendHistory"></strong></label><label for="budget" data-t="limit" class="field"></label><input id="budget" type="range" min="5" max="80" step="5" value="40" style="width:100%"><strong class="number" id="budgetValue">40</strong><p class="small" data-t="limitHint"></p></div><div class="stepbox focus"><div class="tag" data-t="contextTitle"></div><div id="preview" class="story" aria-live="polite"></div><p class="small" id="counts"></p></div></div><p class="small" data-t="status"></p></section>
<section class="panel"><h2 data-t="three"></h2><p class="mission" data-t="experiment"></p><p class="hint" data-t="discovery"></p><p data-t="next"></p><details class="teach"><summary>👩‍🏫 Teacher / المعلم</summary><p data-t="teacher"></p></details></section><nav class="trail" aria-label="Lesson navigation"><a id="prevTrail" href="../03-next-word-prediction/">← Previous lesson</a><a href="../../" id="homeTrail">All lessons</a><a id="nextTrail" href="../05-ai-retrieval/">Next lesson →</a></nav></main><footer class="footer"><div class="wrap">AI Learning Lab · Free · Open source · <a href="README.md">English guide</a> · <a href="README.ar.md">الدليل العربي</a></div></footer><script>"use strict";const T={"en": {"eyebrow": "LESSON 04 · MEMORY LAB", "title": "How Does AI Remember?", "intro": "A chatbot can seem to remember what you said earlier. Many chat apps send previous messages back to the model with each new question. Watch the message history grow and try removing it.", "honest": "This is a real demonstration of building a message history — not a live chatbot. We show exactly which messages an application would send; no AI model answers here.", "one": "1 · Build a conversation", "startHint": "Add any message. You can also write a sample assistant reply to see how both sides of a conversation are included.", "role": "Who said it?", "your": "You", "assistant": "Assistant (you write its sample reply)", "message": "Write a message", "add": "Add to conversation", "reset": "Restore example", "clear": "Clear all messages", "two": "2 · What would AI receive now?", "sendHistory": "Include previous messages", "limit": "Small practice memory limit (words)", "limitHint": "The word limit is only an illustration. Real model limits are measured in tokens and vary by model. Newer messages stay in the preview first.", "contextTitle": "Messages prepared for the next model request", "empty": "No messages have been included.", "kept": "Included", "removed": "Left out by the practice limit", "three": "3 · Try changing the memory", "discovery": "A model is not automatically being retrained each time you send a message. The app can supply earlier messages again, helping it answer using that temporary conversation history. If a message is left out, it is not available from this history.", "next": "Next: How could an assistant obtain new information outside the conversation? Explore tools and agents in Lesson 05.", "experiment": "Try removing the name from the earlier message. Is it still present in the input we would send?", "sampleUser": "My dog is called Max.", "sampleQuestion": "What is my dog called?", "delete": "Remove", "teacher": "Ask: what changes when history is switched off? Does the model truly learn the name forever? No; this demo only prepares the messages.", "previous": "← Lesson 03", "nextNav": "Lesson 05 →", "home": "All lessons", "status": "The next message would be added after this preview. This page does not generate an answer."}, "ar": {"eyebrow": "الدرس ٠٤ · تجربة الذاكرة", "title": "كيف يتذكّر الذكاء الاصطناعي؟", "intro": "قد يبدو أن روبوت المحادثة يتذكّر ما قلته سابقاً. ترسل تطبيقات محادثة كثيرة الرسائل السابقة إلى النموذج مع السؤال الجديد. راقب نمو سجل المحادثة وجرّب حذفه.", "honest": "هذه تجربة حقيقية لتجميع سجل الرسائل، وليست روبوت محادثة مباشراً. نعرض الرسائل التي يمكن أن يرسلها التطبيق للنموذج، دون توليد ردود.", "one": "١ · كوّن محادثة", "startHint": "أضف أي رسالة. ويمكنك أيضاً كتابة رد توضيحي على لسان المساعد لترى كيف يُضاف طرفا الحوار.", "role": "من كتب الرسالة؟", "your": "أنت", "assistant": "المساعد (اكتب رداً توضيحياً بنفسك)", "message": "اكتب رسالة", "add": "أضف إلى المحادثة", "reset": "استعد المثال", "clear": "احذف كل الرسائل", "two": "٢ · ماذا سيتلقى الذكاء الاصطناعي؟", "sendHistory": "أرسل الرسائل السابقة", "limit": "حد تجريبي صغير للذاكرة (عدد الكلمات)", "limitHint": "عدد الكلمات للتوضيح فقط. تُقاس حدود النماذج الحقيقية بالرموز وتختلف من نموذج لآخر. تُحفظ أحدث الرسائل أولاً في المعاينة.", "contextTitle": "الرسائل التي ستُرسَل في الطلب التالي", "empty": "لم تُدرج أي رسالة.", "kept": "الرسائل المرسلة", "removed": "رسائل لم تتسع لها الذاكرة التجريبية", "three": "٣ · جرّب تغيير الذاكرة", "discovery": "لا يُعاد تدريب النموذج تلقائياً كلما أرسلت رسالة. يستطيع التطبيق إرسال الرسائل السابقة من جديد، فيستخدمها النموذج كمعلومات مؤقتة. إذا حذفت رسالة فلن تكون موجودة ضمن هذا السجل.", "next": "التالي: كيف يمكن للمساعد جلب معلومات جديدة من خارج المحادثة؟ سنستكشف الأدوات والوكلاء في الدرس ٠٥.", "experiment": "جرّب حذف الاسم من الرسالة الأولى. هل لا يزال موجوداً ضمن ما سنرسله للنموذج؟", "sampleUser": "اسم كلبي ماكس.", "sampleQuestion": "ما اسم كلبي؟", "delete": "حذف", "teacher": "اسأل: ماذا يتغير عندما نوقف إرسال السجل؟ وهل يتعلم النموذج الاسم للأبد؟ لا؛ التجربة تعرض الرسائل المجمعة فقط.", "previous": "→ الدرس ٠٣", "nextNav": "الدرس ٠٥ ←", "home": "جميع الدروس", "status": "يمكن إضافة السؤال التالي بعد هذه المعاينة. لا تولّد الصفحة إجابة."}};const $=id=>document.getElementById(id);let language='en',history=[];
function t(){return T[language]};function words(s){return (s.trim().match(/\S+/gu)||[]).length}
function sample(){history=[{role:'user',text:t().sampleUser},{role:'user',text:t().sampleQuestion}];$('message').value='';render()}
function render(){const host=$('messages');host.replaceChildren();history.forEach((item,i)=>{const b=document.createElement('div');b.className='stepbox';const row=document.createElement('div');row.className='row';const label=document.createElement('strong');label.textContent=(i+1)+'. '+(item.role==='user'?t().your:t().assistant);const del=document.createElement('button');del.className='btn del';del.type='button';del.textContent=t().delete;del.onclick=()=>{history.splice(i,1);render()};row.append(label,del);const p=document.createElement('p');p.dir='auto';p.textContent=item.text;b.append(row,p);host.append(b)});
 const keep=$('include').checked,budget=Number($('budget').value);$('budgetValue').textContent=String(budget);const preview=$('preview');preview.replaceChildren();let chosen=[],used=0;if(keep){for(let i=history.length-1;i>=0;i--){const count=words(history[i].text);if(used+count>budget)break;chosen.unshift(history[i]);used+=count;}}if(!chosen.length){const p=document.createElement('p');p.className='muted';p.textContent=t().empty;preview.append(p)}else{for(const item of chosen){const b=document.createElement('div');b.className='stepbox';const label=document.createElement('strong');label.textContent=item.role==='user'?t().your:t().assistant;const p=document.createElement('p');p.dir='auto';p.textContent=item.text;b.append(label,p);preview.append(b)}}$('counts').textContent=t().kept+': '+chosen.length+' · '+t().removed+': '+(history.length-chosen.length);}
function localize(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('lang').textContent=language==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t()[el.dataset.t]});$('prevNav').textContent=t().previous;$('nextNav').textContent=t().nextNav;$('prevTrail').textContent=t().previous;$('nextTrail').textContent=t().nextNav;$('homeTrail').textContent=t().home;sample()}
$('lang').onclick=()=>{language=language==='en'?'ar':'en';localize()};$('add').onclick=()=>{const value=$('message').value.trim();if(!value)return;history.push({role:$('role').value,text:value});$('message').value='';render()};$('clear').onclick=()=>{history=[];render()};$('reset').onclick=sample;$('include').onchange=render;$('budget').oninput=render;localize();</script></body></html>
