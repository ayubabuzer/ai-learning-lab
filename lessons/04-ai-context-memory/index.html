text limit (words)", "limitHint": "This uses words for demonstration. Real AI models measure context in tokens.", "contextTitle": "Context available to the next reply", "empty": "No conversation facts are available.", "kept": "Included messages", "removed": "Omitted messages", "three": "📖 Why does context matter?", "experiment": "Try telling the assistant a new pet name, asking it to remember, clearing context and asking again.", "discovery": "The chatbot does not permanently learn the name. The local demo searches selected prior messages for the answer; once they are removed, it cannot retrieve that fact. A real model uses its language abilities to interpret the context.", "next": "Next: see how an assistant can call tools and how agents work toward a goal.", "teacher": "Ask students to switch off history and compare the answer to the same question. The rule-based demo is not a live LLM.", "previous": "← Lesson 03", "nextNav": "Lesson 05 →", "home": "All lessons", "you": "You", "assistant": "Assistant", "unknown": "I do not know that from the conversation context. Tell me first, then ask again.", "ack": "Got it — I can use that information while it remains in the conversation context.", "fallback": "I can demonstrate remembering your name, dog’s name, favourite food or city. Try telling me one of those facts.", "greeting": "Hi! Tell me a fact, then ask me about it.", "dogQ": "Your dog’s name is {value}.", "nameQ": "Your name is {value}.", "foodQ": "Your favourite food is {value}.", "cityQ": "Your city is {value}.", "sampleFact": "My dog’s name is Milo.", "sampleQuestion": "What is my dog’s name?"}, "ar": {"eyebrow": "الدرس ٠٤ · سياق المحادثة", "title": "كيف تتذكر المحادثة؟", "intro": "أخبر المساعد بمعلومة ثم اسأله عنها، وامسح السياق واسأله مرة أخرى. راقب تغير المحادثة والمعلومات المتاحة للرد التالي.", "honest": "📖 هذه محاكاة محلية وسريعة تعتمد على قواعد محددة، وليست نموذج لغة مباشرًا. غالباً ما تعيد تطبيقات المحادثة إرسال الرسائل السابقة، وحذفها يزيل هذه المعلومات من السياق.", "one": "١ · تحدث مع المساعد", "startHint": "جرّب: «اسم كلبي ميلو». ثم اسأل: «ما اسم كلبي؟»", "chatTitle": "المحادثة", "demoTag": "محاكاة محلية", "message": "✍️ رسالتك", "add": "أرسل الرسالة", "reset": "استعادة المثال", "clear": "امسح السياق والمحادثة", "exampleHint": "📖 تدعم التجربة أمثلة اسمك واسم كلبك وطعامك المفضل ومدينتك، ولا تجيب عن كل الأسئلة مثل نموذج حقيقي.", "two": "٢ · ماذا يستطيع المساعد أن يرى؟", "contextHelp": "📖 الرسائل السابقة المختارة هي السياق المؤقت. أوقفها أو احذفها ثم اسأل مرة أخرى لترى الاختلاف.", "sendHistory": "ضمّ الرسائل السابقة إلى السياق", "limit": "حد السياق التجريبي (كلمات)", "limitHint": "نستخدم الكلمات هنا للتوضيح؛ تقيس النماذج الحقيقية السياق بالرموز.", "contextTitle": "السياق المتاح للرد التالي", "empty": "لا توجد معلومات متاحة من المحادثة.", "kept": "الرسائل المضمّنة", "removed": "الرسائل المستبعدة", "three": "📖 لماذا يهم السياق؟", "experiment": "أخبر المساعد باسم حيوانك واسأله عنه، ثم امسح السياق واسأل مرة أخرى.", "discovery": "لا يتعلم الروبوت الاسم بشكل دائم. تبحث المحاكاة المحلية عن المعلومة في الرسائل السابقة المختارة، وعندما تُزال لا تستطيع استرجاعها. يستخدم النموذج الحقيقي قدراته اللغوية لفهم السياق.", "next": "التالي: كيف يستدعي المساعد الأدوات وكيف يعمل الوكيل لتحقيق هدف؟", "teacher": "اطلب من الطلاب إيقاف إرسال السجل ومقارنة الجواب. هذه محاكاة قواعد وليست نموذجاً مباشراً.", "previous": "→ الدرس ٠٣", "nextNav": "الدرس ٠٥ ←", "home": "جميع الدروس", "you": "أنت", "assistant": "المساعد", "unknown": "لا أعرف هذه المعلومة من سياق المحادثة. أخبرني بها أولاً ثم اسأل مجدداً.", "ack": "فهمت! سأستخدم هذه المعلومة ما دامت ضمن سياق المحادثة.", "fallback": "أستطيع توضيح تذكر اسمك واسم كلبك وطعامك المفضل ومدينتك. جرّب إخباري بإحدى هذه المعلومات.", "greeting": "مرحباً! أخبرني بمعلومة ثم اسألني عنها.", "dogQ": "اسم كلبك {value}.", "nameQ": "اسمك {value}.", "foodQ": "طعامك المفضل {value}.", "cityQ": "مدينتك {value}.", "sampleFact": "اسم كلبي ميلو.", "sampleQuestion": "ما اسم كلبي؟"}};let language='en',history=[];const $=id=>document.getElementById(id);const tr=()=>T[language];const count=s=>(s.match(/\S+/gu)||[]).length;
function remembered(){if(!$('include').checked)return[];let chosen=[],used=0;for(let i=history.length-1;i>=0;i--){const w=count(history[i].text);if(w+used>$('budget').value)break;chosen.unshift(history[i]);used+=w;}return chosen;}
function facts(){const result={};for(const item of remembered()){if(item.role!=='user')continue;const text=item.text.trim();const patterns=language==='ar'?{dog:[/اسم كلبي\s+([^؟.!،\n]+)/iu],name:[/اسمي\s+([^؟.!،\n]+)/iu],food:[/طعامي المفضل\s+([^؟.!،\n]+)/iu],city:[/أعيش في\s+([^؟.!،\n]+)/iu]}:{dog:[/my dog(?:'s|’s)? name is\s+([^.!?\n]+)/i,/my dog is (?:called|named)\s+([^.!?\n]+)/i],name:[/my name is\s+([^.!?\n]+)/i],food:[/my favou?rite food is\s+([^.!?\n]+)/i],city:[/i live in\s+([^.!?\n]+)/i]};for(const [key,list] of Object.entries(patterns))for(const regex of list){const m=text.match(regex);if(m){result[key]=m[1].trim();break;}}}return result;}
function respond(question){const q=question.toLowerCase();const f=facts();if(/my (dog(?:'s|’s)? name|name|favou?rite food) is |i live in |اسم كلبي |اسمي |طعامي المفضل |أعيش في /i.test(question))return tr().ack;const ar=language==='ar';if(/^(hi|hello|hey|مرحبا|أهلا)/i.test(q))return tr().greeting;const asks=ar?{dog:/ما اسم كلبي|اسم كلبي\؟/,name:/ما اسمي|ما هو اسمي/,food:/ما طعامي المفضل/,city:/أين أعيش|ما مدينتي/}:{dog:/what(?:'s| is) my dog(?:'s|’s)? name|what is my dog called/i,name:/what(?:'s| is) my name|who am i/i,food:/what(?:'s| is) my favou?rite food/i,city:/where do i live|what(?:'s| is) my city/i};for(const [key,re]of Object.entries(asks))if(re.test(q))return f[key]?tr()[key+'Q'].replace('{value}',f[key]):tr().unknown;return Object.keys(f).length&&(/my |كلبي|اسمي|طعامي|أعيش/.test(q))?tr().ack:tr().fallback;}
function row(role,text){const div=document.createElement('div');div.className='chat-bubble '+(role==='user'?'user-bubble':'assistant-bubble');const head=document.createElement('strong');head.textContent=(role==='user'?'👤 ':'🤖 ')+(role==='user'?tr().you:tr().assistant);const p=document.createElement('p');p.dir='auto';p.textContent=text;div.append(head,p);return div;}
function render(){const host=$('messages');host.replaceChildren();for(const item of history)host.append(row(item.role,item.text));const preview=$('preview');preview.replaceChildren();const chosen=remembered();if(!chosen.length){const p=document.createElement('p');p.textContent=tr().empty;preview.append(p)}else for(const item of chosen)preview.append(row(item.role,item.text));$('budgetValue').textContent=$('budget').value;$('counts').textContent=tr().kept+': '+chosen.length+' · '+tr().removed+': '+(history.length-chosen.length);host.scrollTop=host.scrollHeight;}
function send(){const text=$('message').value.trim();if(!text)return;const answer=respond(text);history.push({role:'user',text},{role:'assistant',text:answer});$('message').value='';render();}
function sample(){history=[];$('message').value='';render();}
function localize(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('lang').textContent=language==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>{if(tr()[el.dataset.t]!==undefined)el.textContent=tr()[el.dataset.t]});$('prevNav').textContent=tr().previous;$('nextNav').textContent=tr().nextNav;$('prevTrail').textContent=tr().previous;$('nextTrail').textContent=tr().nextNav;$('homeTrail').textContent=tr().home;sample();$('message').placeholder=tr().sampleFact;}
$('lang').onclick=()=>{language=language==='en'?'ar':'en';localize()};$('add').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('clear').onclick=()=>{history=[];$('message').value='';render()};$('reset').onclick=sample;$('include').onchange=render;$('budget').oninput=render;localize();</script></body></html>
