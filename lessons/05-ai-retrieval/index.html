{width:19px;height:19px;accent-color:#84aafa}.tool-conversation{border:1px solid #425a7e;border-radius:15px;background:#0b1730;padding:14px;min-width:0}.tool-chat{display:flex;flex-direction:column;gap:12px;padding:12px 4px;min-height:155px;max-height:410px;overflow:auto}.chatbar{padding:4px 2px 10px;border-bottom:1px solid #3c5070}.chat-entry{max-width:92%;border:1px solid #4d6589;padding:11px 13px;border-radius:13px;background:#203451;overflow-wrap:anywhere}.chat-entry.from-user{align-self:flex-end;background:#294975;border-color:#6991ca}.chat-entry.from-ai{align-self:flex-start}.chat-entry.from-tool{align-self:center;width:93%;background:#302c4c;border-color:#8c77b7}.chat-entry.from-result{align-self:center;width:93%;background:#173e42;border-color:#4d9889}.chat-entry p{margin:5px 0 0}.chat-entry strong{font-size:.81rem;opacity:.83}.tool-conversation textarea{width:100%;min-height:76px}.agent-demo .tool-conversation{max-width:800px;margin:0 auto}.tool-demo .controls,.agent-demo .controls{display:flex;flex-wrap:wrap}@media(max-width:750px){.tool-grid{grid-template-columns:1fr}}

const T={
en:{one:'1 · Ask a question — watch the tool call',oneText:'Your application gives the model descriptions of available tools. A tool-capable model may choose one based on the question. This page simulates the selection, arguments, return value and answer; it does not contact external services.',toolInfo:'⚙️ Configured tools',source:'Enable or disable tools, then ask different questions. The model proposes a tool call; the application checks and executes it.',chatTitle:'Tool-use chat · simulated',askLabel:'✍️ Your question',askButton:'Send question',start:'Start again',chooseHint:'Try: “What is the weather in London?”, “What is 12 × 8?”, or “Find recent AI news.”',two:'2 · An agent keeps working towards its goal',twoText:'Unlike a single tool call, an agent can repeatedly decide what to do next, examine results and continue until the goal is achieved, a limit is reached, or approval is needed.',agentChatTitle:'Agent chat · goal and actions',next:'Continue agent →',runAgent:'▶ Run agent',scenarioLabel:'Choose a goal',scenarioPicnic:'Plan a picnic with a backup',scenarioHeadphones:'Find headphones within a budget',toolRule:'📖 The developer defines each tool with a name, description and expected inputs (for example: weather questions → weather_forecast, arithmetic → calculator, recent information → web_search). A tool-capable model can choose an appropriate tool; the application checks the request and executes it. This page uses rule-based selection, not a live LLM.',agentDefinition:'📖 What is an agent? An agent uses a model and tools to pursue a goal. After each result it can decide what to do next, repeat, or stop when the goal is achieved, the limits are reached, or a person needs to approve an action.',agentCycle:'🎯 Goal → 🧠 Decide → 🔧 Use a tool → 👁️ Inspect the result → 🔁 Continue or stop.',three:'3 · What did we learn?',discovery:'A tool gives the application access to information or an action. A model can ask for a tool; the application validates and executes that call. An agent can choose more steps based on new results. Every agent needs stop conditions, safety checks and human approval for important actions.',nextLesson:'Next: create a real Digital Twin chatbot in Lesson 06. It is not an autonomous agent.',teacher:'Ask learners to disable the weather tool, repeat the same question, and explain why the answer changes. Then follow the agent until it stops.',home:'All lessons',previous:'← Lesson 04',nextNav:'Lesson 06 →',user:'You',assistant:'Assistant',request:'Proposed tool call',reply:'Tool result (illustrative)',missing:'This demonstration has no matching enabled tool. A real assistant should explain its limitation rather than invent live information.',agentGoal:'Find the best day for an outdoor picnic and suggest a backup.',agentSteps:[['assistant','Goal received: choose a good day for a picnic.'],['tool','Call weather_forecast({day:"Saturday and Sunday"})'],['result','Illustrative forecast: Saturday rainy; Sunday dry.'],['assistant','Sunday looks better. I should check for a backup option.'],['tool','Call web_search({query:"indoor picnic alternatives"})'],['result','Illustrative result: an indoor community space is an option.'],['assistant','Goal complete: recommend Sunday, with an indoor backup. Check details before acting.']]},
ar:{one:'١ · اسأل سؤالاً وشاهد استدعاء الأداة',oneText:'يعرّف التطبيق النموذج بالأدوات المتاحة. قد يختار النموذج أداة وفق السؤال. تحاكي هذه الصفحة الاختيار والمعاملات والنتيجة والجواب، ولا تتصل بخدمات حقيقية.',toolInfo:'⚙️ الأدوات المهيأة',source:'فعّل الأدوات أو عطّلها ثم جرّب أسئلة مختلفة. يقترح النموذج استدعاء الأداة ويتولى التطبيق التحقق والتنفيذ.',chatTitle:'محادثة استخدام الأدوات · محاكاة',askLabel:'✍️ سؤالك',askButton:'أرسل السؤال',start:'ابدأ من جديد',chooseHint:'جرّب: «ما طقس لندن؟»، «احسب 12 × 8»، أو «ابحث عن أخبار الذكاء الاصطناعي».',two:'٢ · الوكيل يواصل العمل حتى يحقق هدفه',twoText:'خلافاً لاستدعاء أداة واحدة، يمكن للوكيل اختيار خطوات متكررة وتقييم النتائج والمتابعة حتى يحقق الهدف أو يصل إلى حد معين أو يحتاج إلى الموافقة.',agentChatTitle:'محادثة الوكيل · الهدف والإجراءات',next:'تابع الوكيل ←',runAgent:'▶ تشغيل الوكيل',scenarioLabel:'اختر هدفاً',scenarioPicnic:'خطط لنزهة مع بديل',scenarioHeadphones:'ابحث عن سماعات ضمن الميزانية',toolRule:'📖 يحدد المطور لكل أداة اسماً ووصفاً ومدخلات متوقعة (الطقس ← أداة الطقس، الحساب ← الحاسبة، الأخبار الحديثة ← البحث). يستطيع النموذج القادر على استخدام الأدوات اختيار المناسب، ويتحقق التطبيق من الطلب ثم ينفذه. هذه الصفحة تستخدم قواعد مبسطة وليست نموذجاً مباشراً.',agentDefinition:'📖 ما الوكيل؟ يستخدم الوكيل نموذجاً وأدوات لتحقيق هدف. بعد كل نتيجة يمكنه أن يقرر الخطوة التالية ويكرر العمل أو يتوقف عند تحقق الهدف أو بلوغ الحدود أو الحاجة لموافقة بشرية.',agentCycle:'🎯 هدف ← 🧠 قرار ← 🔧 أداة ← 👁️ فحص النتيجة ← 🔁 متابعة أو توقف.',three:'٣ · ماذا تعلمنا؟',discovery:'تتيح الأداة للتطبيق الوصول إلى المعلومات أو تنفيذ إجراء. يطلب النموذج الأداة ويتولى التطبيق التحقق والتنفيذ. يمكن للوكيل اتخاذ خطوات جديدة بناء على النتائج؛ ويحتاج إلى حدود وشروط توقف وموافقة بشرية عند الإجراءات الحساسة.',nextLesson:'التالي: ابنِ توأماً رقمياً حقيقياً في الدرس السادس. إنه روبوت محادثة وليس وكيلاً مستقلاً.',teacher:'اطلب من الطلاب تعطيل أداة الطقس ثم تكرار السؤال ومناقشة ما تغير. بعد ذلك تابع الوكيل حتى يتوقف.',home:'جميع الدروس',previous:'→ الدرس ٠٤',nextNav:'الدرس ٠٦ ←',user:'أنت',assistant:'المساعد',request:'استدعاء الأداة المقترح',reply:'نتيجة توضيحية من الأداة',missing:'لا تتوفر أداة مفعّلة مناسبة في هذه المحاكاة. ينبغي للمساعد الحقيقي توضيح حدوده بدلاً من اختلاق بيانات حية.',agentGoal:'اختر أفضل يوم لنزهة في الهواء الطلق واقترح بديلاً.',agentSteps:[['assistant','الهدف: اختيار يوم مناسب للنزهة.'],['tool','استدعاء weather_forecast({day:"Saturday and Sunday"})'],['result','توقع توضيحي: السبت ممطر والأحد جاف.'],['assistant','الأحد أفضل. أحتاج إلى خيار احتياطي.'],['tool','استدعاء web_search({query:"indoor picnic alternatives"})'],['result','نتيجة توضيحية: مكان داخلي قد يكون مناسباً.'],['assistant','اكتمل الهدف: اختر الأحد مع خطة داخلية بديلة. تحقق قبل التنفيذ.']]}};
Object.assign(T.en,{eyebrow:'LESSON 05 · TOOLS AND AGENTS',title:'How does AI use tools and work toward a goal?',intro:'See how a question leads to a tool call, then watch an agent work through a larger goal.',honest:'📖 These are offline teaching examples; weather, search and product results are fictional. The calculator uses your real arithmetic input.'});
Object.assign(T.ar,{eyebrow:'الدرس ٠٥ · الأدوات والوكلاء',title:'كيف يستخدم الذكاء الاصطناعي الأدوات ويسعى إلى هدف؟',intro:'شاهد كيف يختار السؤال أداة مناسبة، ثم تابع وكيلاً ينفذ خطوات لتحقيق هدف أكبر.',honest:'📖 هذه أمثلة تعليمية تعمل دون إنترنت؛ نتائج الطقس والبحث والمنتجات افتراضية، والحاسبة تحسب المدخلات العددية فعلياً.'});
const TOOL=[{id:'weather',label:'🌤️ weather_forecast',ar:'🌤️ توقع الطقس',desc:'Current weather',descAr:'معلومات الطقس',call:'weather_forecast({place:"London"})',result:'Example only: cloudy, 14°C.',answer:'In this fictional example, London is cloudy and 14°C.'},{id:'calculator',label:'🧮 calculator',ar:'🧮 الحاسبة',desc:'Arithmetic',descAr:'عمليات حسابية',call:'calculator({expression:"12 * 8"})',result:'96',answer:'12 × 8 = 96.'},{id:'search',label:'🔍 web_search',ar:'🔍 البحث',desc:'External information',descAr:'معلومات خارجية',call:'web_search({query:"recent AI news"})',result:'Example only: two hypothetical search results.',answer:'A real search would return sources to check. This example does not retrieve live news.'}];
const $=id=>document.getElementById(id);let language='en',enabled=new Set(TOOL.map(x=>x.id)),agentStep=0;function tr(){return T[language]}
function bubble(host,type,title,body){const d=document.createElement('div');d.className='chat-entry '+type;const head=document.createElement('strong');head.textContent=title;const p=document.createElement('p');p.textContent=body;d.append(head,p);host.append(d);host.scrollTop=host.scrollHeight}
function selectTool(q){const low=q.toLowerCase();if(/weather|rain|temperature|forecast|طقس|مطر|حرار/.test(low))return TOOL[0];if(/calculate|\d+\s*[+*×xX÷/-]\s*\d+|math|احسب|كم يساوي/.test(low))return TOOL[1];if(/search|find|news|latest|recent|ابحث|أخبار|آخر/.test(low))return TOOL[2];return null}
function renderTools(){const host=$('configuredTools');host.replaceChildren();TOOL.forEach(item=>{const row=document.createElement('label');row.className='tool-toggle';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=enabled.has(item.id);checkbox.onchange=()=>{checkbox.checked?enabled.add(item.id):enabled.delete(item.id)};const desc=document.createElement('span');desc.textContent=(language==='ar'?item.ar:item.label)+' · '+(language==='ar'?item.descAr:item.desc);row.append(checkbox,desc);host.append(row)})}
function parseMath(q){
 const m=q.match(/(-?\d+(?:\.\d+)?)\s*([+*×xX÷/-])\s*(-?\d+(?:\.\d+)?)/);
 if(!m)return null;
 const a=Number(m[1]),b=Number(m[3]),op=m[2].toLowerCase();
 const value=op==='+'?a+b:op==='-'?a-b:['x','*','×'].includes(op)?a*b:b===0?NaN:a/b;
 return {a,b,op,value,expression:`${a} ${['x','×','*'].includes(op)?'×':op} ${b}`};
}
function ask(){
 const q=$('userQuestion').value.trim();if(!q)return;
 const host=$('toolChat');bubble(host,'from-user',tr().user,q);
 const item=selectTool(q);
 if(!item||!enabled.has(item.id)){bubble(host,'from-ai',tr().assistant,tr().missing);return}
 if(item.id==='calculator'){
  const calc=parseMath(q);
  if(!calc){bubble(host,'from-ai',tr().assistant,language==='ar'?'أدخل عملية مثل ٥ × ٢.':'Try an expression such as 5 x 2.');return}
  bubble(host,'from-tool',tr().request,`calculator({expression:"${calc.expression}"})`);
  bubble(host,'from-result',language==='ar'?'نتيجة الحاسبة':'Calculator result',Number.isFinite(calc.value)?String(calc.value):(language==='ar'?'لا يمكن القسمة على صفر.':'Cannot divide by zero.'));
  bubble(host,'from-ai',tr().assistant,Number.isFinite(calc.value)?`${calc.expression} = ${calc.value}`:(language==='ar'?'لا يمكن القسمة على صفر.':'Division by zero is undefined.'));
  return;
 }
 if(item.id==='weather'&&!/london|لندن/i.test(q)){
  bubble(host,'from-ai',tr().assistant,language==='ar'?'هذا المثال يعرض طقس لندن الافتراضي فقط. جرّب السؤال عن لندن.':'This offline weather example only has fictional London data. Try asking about London.');return;
 }
 bubble(host,'from-tool',tr().request,item.call);
 bubble(host,'from-result',tr().reply,item.result);
 bubble(host,'from-ai',tr().assistant,item.answer);
}
