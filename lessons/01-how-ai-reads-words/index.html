<script>"use strict"; const T={"en":{"eyebrow":"LESSON 01 · FROM TEXT TO TOKENS","title":"How does AI read your words?","intro":"When you send a message to AI, it first breaks your text into smaller pieces called tokens. Each piece has a number, and the model uses learned number patterns to work with language. Change the message to see what happens.","honesty":"For teaching: these are example pieces, IDs and number patterns—not output from a real tokenizer or AI model.","inputRole":"✍️ YOUR INPUT","explainRole":"📖 EXPLANATION & EXAMPLE","first":"1 · Write a message","tryHint":"Choose an example or type your own message. The next steps change as you type.","writeLabel":"Your text","reset":"Reset","tokensTitle":"2 · Your message becomes pieces","tokensExplain":"AI works with tokens: small pieces of text. A word might be one token or several; spaces and punctuation can be included too.","tokensCaution":"We show simple word chunks here. Real AI tokenizers can divide text differently.","idsTitle":"3 · Each piece gets a number","idsExplain":"Think of the number as a dictionary label. It identifies the piece; it does not tell us what the word means.","idsCaution":"These are made-up, consistent IDs to show how the process works.","vectorsTitle":"4 · AI learns number patterns","vectorsExplain":"For each token, the model learns a list of numbers, called a vector. It uses these patterns alongside other words in the message.","vectorsCaution":"Example pattern for the first piece only. Real vectors contain many more numbers.","mapTitle":"5 · Related words on a map","mapExplain":"Words such as cat and dog often appear in similar situations. Their learned representations can reflect this relationship, so imagine them close together on a map.","mapCaution":"This drawing is conceptual, not measured model coordinates.","mapBridge":"📖 Lesson 2 lets you explore a simple map of related words. Use Next Lesson when you're ready."},"ar":{"eyebrow":"الدرس ٠١ · من النص إلى الرموز","title":"كيف يقرأ الذكاء الاصطناعي كلماتك؟","intro":"عندما ترسل رسالة إلى الذكاء الاصطناعي، يقسّم النص أولاً إلى أجزاء صغيرة تسمى رموزاً. لكل جزء رقم، ويتعلّم النموذج أنماطاً عددية تساعده على التعامل مع اللغة. غيّر الرسالة ولاحظ الخطوات.","honesty":"للتعليم: هذه القطع والأرقام والأنماط أمثلة توضيحية وليست نتائج نموذج حقيقي.","inputRole":"✍️ مدخلاتك","explainRole":"📖 شرح ومثال","first":"١ · اكتب رسالة","tryHint":"اختر مثالاً أو اكتب رسالة. تتغير الخطوات التالية أثناء الكتابة.","writeLabel":"نص الرسالة","reset":"إعادة الضبط","tokensTitle":"٢ · تتحول الرسالة إلى أجزاء","tokensExplain":"يعمل الذكاء الاصطناعي مع رموز، وهي أجزاء صغيرة من النص. قد تكون الكلمة رمزاً واحداً أو أكثر، وقد تدخل المسافات وعلامات الترقيم فيها.","tokensCaution":"نعرض هنا قطع كلمات مبسطة؛ قد تقسمها أدوات الترميز الحقيقية بصورة مختلفة.","idsTitle":"٣ · يحصل كل جزء على رقم","idsExplain":"تخيّل الرقم كرقم فهرس في قاموس: يحدد الجزء ولا يصف معناه.","idsCaution":"هذه أرقام توضيحية ثابتة، وليست أرقام نموذج حقيقي.","vectorsTitle":"٤ · يتعلّم الذكاء الاصطناعي أنماطاً عددية","vectorsExplain":"يتعلّم النموذج لكل رمز قائمة من الأرقام تسمى متجهاً. يستخدم هذه الأنماط مع بقية كلمات الرسالة.","vectorsCaution":"نعرض مثالاً للجزء الأول فقط؛ المتجهات الحقيقية تحتوي أرقاماً أكثر.","mapTitle":"٥ · الكلمات المرتبطة على الخريطة","mapExplain":"تظهر كلمتا القطة والكلب في مواقف متشابهة كثيراً. قد تعكس تمثيلاتهما المتعلَّمة هذه العلاقة، فتخيّلهما متقاربتين على خريطة.","mapCaution":"الخريطة رسم توضيحي وليست إحداثيات نموذج حقيقي.","mapBridge":"📖 في الدرس الثاني ستستكشف خريطة بسيطة للكلمات المرتبطة. انتقل إليه من زر الدرس التالي."}}; const examples={en:{one:'The cat drinks milk!',two:'I love building robots!',emoji:'Hello 👋 🌍!'},ar:{one:'القطة تشرب الحليب!',two:'أحب بناء الروبوتات!',emoji:'مرحباً 👋 🌍!'}}; let language='en';const $=id=>document.getElementById(id);
function pieces(text){return text.match(/\S+/gu)||[]}
function idFor(word){let h=5381;for(const c of Array.from(word))h=(Math.imul(h,33)+c.codePointAt(0))>>>0;return 1000+h%90000}
function element(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=txt;return el}
function render(){const arr=pieces($('inputText').value).slice(0,30);['pieces','identifiers','vectors'].forEach(id=>$(id).replaceChildren());for(const word of arr){$('pieces').append(element('span','chip',word));const id=idFor(word);const idChip=element('span','chip',word+' → '+id);$('identifiers').append(idChip);const nums=[Math.sin(id)*.9,Math.cos(id*.7)*.9,Math.sin(id*.04)*.9].map(n=>n.toFixed(2));if(word===arr[0])$('vectors').append(element('span','chip',word+' → ['+nums.join(', ')+', …]'));}}
function localize(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('switchLanguage').textContent=language==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T[language][el.dataset.t]);document.querySelectorAll('[data-sample]').forEach(el=>el.textContent=examples[language][el.dataset.sample]);$('inputText').value=examples[language].one;render();}
$('inputText').addEventListener('input',render);$('reset').onclick=()=>{$('inputText').value=examples[language].one;render()};document.querySelectorAll('[data-sample]').forEach(el=>el.onclick=()=>{$('inputText').value=examples[language][el.dataset.sample];render()});$('switchLanguage').onclick=()=>{language=language==='en'?'ar':'en';localize()};localize();</script>
