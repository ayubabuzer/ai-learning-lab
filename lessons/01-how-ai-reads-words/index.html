<script>"use strict"; const T={"en": {"eyebrow": "LESSON 01 · FROM TEXT TO TOKENS", "title": "How does AI read your words?", "intro": "When you type a message, an AI model does not receive a dictionary of whole words. A tokenizer divides the text into reusable pieces, assigns each piece an ID, then the model turns those IDs into learned number vectors. Those representations help the model work with patterns and context. Try changing the message to see the stages.", "honesty": "This instant, browser-only experiment uses simplified word pieces, illustrative IDs and invented vectors. It does not run a pretrained tokenizer or model.", "inputRole": "✍️ YOUR INPUT", "explainRole": "📖 EXPLANATION & EXAMPLE", "first": "1 · Write a message", "tryHint": "Try a sentence, an unfamiliar word or punctuation. Watch all stages update immediately.", "writeLabel": "Your text", "reset": "Reset", "tokensTitle": "2 · Text becomes tokens", "tokensExplain": "A real tokenizer may keep a short word together or break a longer word into smaller pieces. Tokens are the units the model processes; they are not always complete words.", "tokensCaution": "Coloured pieces here are simplified whitespace-separated chunks, not actual model tokens.", "idsTitle": "3 · Tokens get IDs", "idsExplain": "A tokenizer has a vocabulary: each recognised piece maps to a particular number. The model uses that identifier to look up its learned representation. An ID is a label, not the meaning of a word.", "idsCaution": "IDs below are deterministic teaching labels, not values from a real tokenizer.", "vectorsTitle": "4 · The model uses learned vectors", "vectorsExplain": "Each ID points to a learned vector: many numbers that can help the model process relationships. Context and the model layers refine how each token contributes to the response.", "vectorsCaution": "The three numbers shown for each piece are invented examples. Real models use much larger vectors.", "mapTitle": "5 · Where do related words appear on a map?", "mapExplain": "Imagine compressing very large learned vectors onto a two-dimensional map. Related concepts may appear close together, although context can change their representations.", "mapCaution": "This drawing is conceptual, not measured model coordinates.", "mapBridge": "📖 In Lesson 2 you will change the examples and explore an interactive word map. Finish this lesson and use Next Lesson at the bottom."}, "ar": {"eyebrow": "الدرس ٠١ · من النص إلى الرموز", "title": "كيف يقرأ الذكاء الاصطناعي كلماتك؟", "intro": "عندما تكتب رسالة، لا يستقبل النموذج قاموساً من الكلمات الكاملة. تقسم أداة الترميز النص إلى قطع قابلة لإعادة الاستخدام، وتعطي كل قطعة رقماً تعريفياً، ثم يحول النموذج الأرقام إلى متجهات عددية متعلمة. تساعد هذه التمثيلات النموذج على معالجة الأنماط والسياق. غيّر الرسالة لترى المراحل.", "honesty": "هذه تجربة فورية داخل المتصفح تستخدم قطعاً مبسطة وأرقاماً ومتجهات توضيحية؛ ليست أداة ترميز أو نموذجاً مدرباً حقيقياً.", "inputRole": "✍️ مدخلاتك", "explainRole": "📖 شرح ومثال", "first": "١ · اكتب رسالة", "tryHint": "جرّب جملة أو كلمة غير مألوفة أو علامات ترقيم. ستتغير المراحل فوراً.", "writeLabel": "نص الرسالة", "reset": "إعادة الضبط", "tokensTitle": "٢ · يتحول النص إلى رموز", "tokensExplain": "قد تحتفظ أداة الترميز الحقيقية بكلمة قصيرة كاملة أو تقسّم كلمة طويلة إلى أجزاء أصغر. الرموز هي الوحدات التي يعالجها النموذج، وليست دائماً كلمات كاملة.", "tokensCaution": "القطع الملوّنة هنا مقسمة تبعاً للمسافات للتوضيح، وليست رموز نموذج حقيقي.", "idsTitle": "٣ · لكل رمز رقم تعريفي", "idsExplain": "تملك أداة الترميز مفردات تربط كل قطعة معروفة برقم محدد. يستخدم النموذج هذا الرقم للوصول إلى تمثيله المتعلم. الرقم مُعرّف وليس معنى الكلمة.", "idsCaution": "هذه أرقام توضيحية ثابتة، وليست أرقام أداة ترميز حقيقية.", "vectorsTitle": "٤ · يستخدم النموذج متجهات متعلمة", "vectorsExplain": "يرتبط كل رقم بمتجه متعلم: قائمة من الأعداد تساعد النموذج على معالجة العلاقات. ويؤثر السياق وطبقات النموذج في كيفية مساهمة كل رمز في الاستجابة.", "vectorsCaution": "الأرقام الثلاثة المعروضة لكل قطعة أمثلة مبتكرة، والمتجهات الحقيقية أكبر بكثير.", "mapTitle": "٥ · أين تظهر الكلمات المرتبطة على الخريطة؟", "mapExplain": "تخيل ضغط المتجهات المتعلمة الكبيرة إلى خريطة ثنائية الأبعاد. قد تتقارب المفاهيم المرتبطة، لكن السياق يمكن أن يغير تمثيلها.", "mapCaution": "الخريطة رسم توضيحي وليست إحداثيات نموذج حقيقي.", "mapBridge": "📖 في الدرس الثاني ستغيّر الأمثلة وتستكشف خريطة كلمات تفاعلية. أكمل هذا الدرس ثم استخدم زر الدرس التالي في الأسفل."}}; const examples={en:{one:'The cat drinks milk!',two:'I love building robots!',emoji:'Hello 👋 🌍!'},ar:{one:'القطة تشرب الحليب!',two:'أحب بناء الروبوتات!',emoji:'مرحباً 👋 🌍!'}}; let language='en';const $=id=>document.getElementById(id);
function pieces(text){return text.match(/\S+/gu)||[]}
function idFor(word){let h=5381;for(const c of Array.from(word))h=(Math.imul(h,33)+c.codePointAt(0))>>>0;return 1000+h%90000}
function element(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=txt;return el}
function render(){const arr=pieces($('inputText').value).slice(0,30);['pieces','identifiers','vectors'].forEach(id=>$(id).replaceChildren());for(const word of arr){$('pieces').append(element('span','chip',word));const id=idFor(word);const idChip=element('span','chip',word+' → '+id);$('identifiers').append(idChip);const nums=[Math.sin(id)*.9,Math.cos(id*.7)*.9,Math.sin(id*.04)*.9].map(n=>n.toFixed(2));$('vectors').append(element('span','chip',word+' → ['+nums.join(', ')+', …]'));}}
function localize(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('switchLanguage').textContent=language==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T[language][el.dataset.t]);document.querySelectorAll('[data-sample]').forEach(el=>el.textContent=examples[language][el.dataset.sample]);$('inputText').value=examples[language].one;render();}
$('inputText').addEventListener('input',render);$('reset').onclick=()=>{$('inputText').value=examples[language].one;render()};document.querySelectorAll('[data-sample]').forEach(el=>el.onclick=()=>{$('inputText').value=examples[language][el.dataset.sample];render()});$('switchLanguage').onclick=()=>{language=language==='en'?'ar':'en';localize()};localize();</script>
