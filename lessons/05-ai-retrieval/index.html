{width:19px;height:19px;accent-color:#84aafa}.tool-conversation{border:1px solid #425a7e;border-radius:15px;background:#0b1730;padding:14px;min-width:0}.tool-chat{display:flex;flex-direction:column;gap:12px;padding:12px 4px;min-height:155px;max-height:410px;overflow:auto}.chatbar{padding:4px 2px 10px;border-bottom:1px solid #3c5070}.chat-entry{max-width:92%;border:1px solid #4d6589;padding:11px 13px;border-radius:13px;background:#203451;overflow-wrap:anywhere}.chat-entry.from-user{align-self:flex-end;background:#294975;border-color:#6991ca}.chat-entry.from-ai{align-self:flex-start}.chat-entry.from-tool{align-self:center;width:93%;background:#302c4c;border-color:#8c77b7}.chat-entry.from-result{align-self:center;width:93%;background:#173e42;border-color:#4d9889}.chat-entry p{margin:5px 0 0}.chat-entry strong{font-size:.81rem;opacity:.83}.tool-conversation textarea{width:100%;min-height:76px}.agent-demo .tool-conversation{max-width:800px;margin:0 auto}.tool-demo .controls,.agent-demo .controls{display:flex;flex-wrap:wrap}@media(max-width:750px){.tool-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../../">✦ AI Learning Lab</a><nav aria-label="Lesson navigation" class="navlinks"><a class="btn" href="../04-ai-context-memory/" id="prevNav">← Lesson 04</a><a class="btn" href="../06-digital-twin/" id="nextNav">Lesson 06 →</a><button class="btn" id="lang" type="button">العربية</button></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow" data-t="eyebrow"></span><h1 data-t="title"></h1><p data-t="intro"></p><p class="hint" data-t="honest"></p></section>

const T={
en:{one:'1 · Ask a question — watch the tool call',oneText:'Your application gives the model descriptions of available tools. A tool-capable model may choose one based on the question. This page simulates the selection, arguments, return value and answer; it does not contact external services.',toolInfo:'⚙️ Configured tools',source:'Enable or disable tools, then ask different questions. The model proposes a tool call; the application checks and executes it.',chatTitle:'Tool-use chat · simulated',askLabel:'✍️ Your question',askButton:'Send question',start:'Start again',chooseHint:'Try: “What is the weather in London?”, “What is 12 × 8?”, or “Find recent AI news.”',two:'2 · An agent keeps working towards its goal',twoText:'Unlike a single tool call, an agent can repeatedly decide what to do next, examine results and continue until the goal is achieved, a limit is reached, or approval is needed.',agentChatTitle:'Agent chat · goal and actions',next:'Continue agent →',three:'3 · What did we learn?',discovery:'A tool gives the application access to information or an action. A model can ask for a tool; the application validates and executes that call. An agent can choose more steps based on new results. Every agent needs stop conditions, safety checks and human approval for important actions.',nextLesson:'Next: create a real Digital Twin chatbot in Lesson 06. It is not an autonomous agent.',teacher:'Ask learners to disable the weather tool, repeat the same question, and explain why the answer changes. Then follow the agent until it stops.',home:'All lessons',previous:'← Lesson 04',nextNav:'Lesson 06 →',user:'You',assistant:'Assistant',request:'Proposed tool call',reply:'Tool result (illustrative)',missing:'This demonstration has no matching enabled tool. A real assistant should explain its limitation rather than invent live information.',agentGoal:'Find the best day for an outdoor picnic and suggest a backup.',agentSteps:[['assistant','Goal received: choose a good day for a picnic.'],['tool','Call weather_forecast({day:"Saturday and Sunday"})'],['result','Illustrative forecast: Saturday rainy; Sunday dry.'],['assistant','Sunday looks better. I should check for a backup option.'],['tool','Call web_search({query:"indoor picnic alternatives"})'],['result','Illustrative result: an indoor community space is an option.'],['assistant','Goal complete: recommend Sunday, with an indoor backup. Check details before acting.']]},
ar:{one:'١ · اسأل سؤالاً وشاهد استدعاء الأداة',oneText:'يعرّف التطبيق النموذج بالأدوات المتاحة. قد يختار النموذج أداة وفق السؤال. تحاكي هذه الصفحة الاختيار والمعاملات والنتيجة والجواب، ولا تتصل بخدمات حقيقية.',toolInfo:'⚙️ الأدوات المهيأة',source:'فعّل الأدوات أو عطّلها ثم جرّب أسئلة مختلفة. يقترح النموذج استدعاء الأداة ويتولى التطبيق التحقق والتنفيذ.',chatTitle:'محادثة استخدام الأدوات · محاكاة',askLabel:'✍️ سؤالك',askButton:'أرسل السؤال',start:'ابدأ من جديد',chooseHint:'جرّب: «ما طقس لندن؟»، «احسب 12 × 8»، أو «ابحث عن أخبار الذكاء الاصطناعي».',two:'٢ · الوكيل يواصل العمل حتى يحقق هدفه',twoText:'خلافاً لاستدعاء أداة واحدة، يمكن للوكيل اختيار خطوات متكررة وتقييم النتائج والمتابعة حتى يحقق الهدف أو يصل إلى حد معين أو يحتاج إلى الموافقة.',agentChatTitle:'محادثة الوكيل · الهدف والإجراءات',next:'تابع الوكيل ←',three:'٣ · ماذا تعلمنا؟',discovery:'تتيح الأداة للتطبيق الوصول إلى المعلومات أو تنفيذ إجراء. يطلب النموذج الأداة ويتولى التطبيق التحقق والتنفيذ. يمكن للوكيل اتخاذ خطوات جديدة بناء على النتائج؛ ويحتاج إلى حدود وشروط توقف وموافقة بشرية عند الإجراءات الحساسة.',nextLesson:'التالي: ابنِ توأماً رقمياً حقيقياً في الدرس السادس. إنه روبوت محادثة وليس وكيلاً مستقلاً.',teacher:'اطلب من الطلاب تعطيل أداة الطقس ثم تكرار السؤال ومناقشة ما تغير. بعد ذلك تابع الوكيل حتى يتوقف.',home:'جميع الدروس',previous:'→ الدرس ٠٤',nextNav:'الدرس ٠٦ ←',user:'أنت',assistant:'المساعد',request:'استدعاء الأداة المقترح',reply:'نتيجة توضيحية من الأداة',missing:'لا تتوفر أداة مفعّلة مناسبة في هذه المحاكاة. ينبغي للمساعد الحقيقي توضيح حدوده بدلاً من اختلاق بيانات حية.',agentGoal:'اختر أفضل يوم لنزهة في الهواء الطلق واقترح بديلاً.',agentSteps:[['assistant','الهدف: اختيار يوم مناسب للنزهة.'],['tool','استدعاء weather_forecast({day:"Saturday and Sunday"})'],['result','توقع توضيحي: السبت ممطر والأحد جاف.'],['assistant','الأحد أفضل. أحتاج إلى خيار احتياطي.'],['tool','استدعاء web_search({query:"indoor picnic alternatives"})'],['result','نتيجة توضيحية: مكان داخلي قد يكون مناسباً.'],['assistant','اكتمل الهدف: اختر الأحد مع خطة داخلية بديلة. تحقق قبل التنفيذ.']]}};
const TOOL=[{id:'weather',label:'🌤️ weather_forecast',ar:'🌤️ توقع الطقس',desc:'Current weather / الطقس',call:'weather_forecast({place:"London"})',result:'Example only: cloudy, 14°C.',answer:'In this fictional example, London is cloudy and 14°C.'},{id:'calculator',label:'🧮 calculator',ar:'🧮 الحاسبة',desc:'Arithmetic / الحساب',call:'calculator({expression:"12 * 8"})',result:'96',answer:'12 × 8 = 96.'},{id:'search',label:'🔍 web_search',ar:'🔍 البحث',desc:'External information / معلومات خارجية',call:'web_search({query:"recent AI news"})',result:'Example only: two hypothetical search results.',answer:'A real search would return sources to check. This example does not retrieve live news.'}];
const $=id=>document.getElementById(id);let language='en',enabled=new Set(TOOL.map(x=>x.id)),agentStep=0;function tr(){return T[language]}
function bubble(host,type,title,body){const d=document.createElement('div');d.className='chat-entry '+type;const head=document.createElement('strong');head.textContent=title;const p=document.createElement('p');p.textContent=body;d.append(head,p);host.append(d);host.scrollTop=host.scrollHeight}
function selectTool(q){const low=q.toLowerCase();if(/weather|rain|temperature|forecast|طقس|مطر|حرار/.test(low))return TOOL[0];if(/calculate|\d+\s*[+*×÷/-]\s*\d+|math|احسب|كم يساوي/.test(low))return TOOL[1];if(/search|find|news|latest|recent|ابحث|أخبار|آخر/.test(low))return TOOL[2];return null}
function renderTools(){const host=$('configuredTools');host.replaceChildren();TOOL.forEach(item=>{const row=document.createElement('label');row.className='tool-toggle';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=enabled.has(item.id);checkbox.onchange=()=>{checkbox.checked?enabled.add(item.id):enabled.delete(item.id)};const desc=document.createElement('span');desc.textContent=(language==='ar'?item.ar:item.label)+' · '+item.desc;row.append(checkbox,desc);host.append(row)})}
function ask(){const q=$('userQuestion').value.trim();if(!q)return;const host=$('toolChat');bubble(host,'from-user',tr().user,q);const item=selectTool(q);if(!item||!enabled.has(item.id)){bubble(host,'from-ai',tr().assistant,tr().missing);return}bubble(host,'from-tool',tr().request,item.call);bubble(host,'from-result',tr().reply,item.result);bubble(host,'from-ai',tr().assistant,item.id==='calculator'?((()=>{const x=q.match(/(-?\d+)\s*([+*×÷/-])\s*(-?\d+)/);if(!x)return item.answer;const a=+x[1],b=+x[3];const n=x[2]==='+'?a+b:x[2]==='-'?a-b:['*','×'].includes(x[2])?a*b:b===0?NaN:a/b;return Number.isFinite(n)?x[1]+' '+x[2]+' '+x[3]+' = '+n:item.answer})()):item.answer)}
function renderAgent(){const host=$('agentChat');host.replaceChildren();bubble(host,'from-user',tr().user,tr().agentGoal);for(let i=0;i<=agentStep;i++){const step=tr().agentSteps[i];bubble(host,step[0]==='assistant'?'from-ai':step[0]==='tool'?'from-tool':'from-result',step[0]==='assistant'?tr().assistant:step[0]==='tool'?tr().request:tr().reply,step[1])}$('nextAgent').disabled=agentStep===tr().agentSteps.length-1}
function localize(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('lang').textContent=language==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=tr()[el.dataset.t]});$('prevNav').textContent=tr().previous;$('nextNav').textContent=tr().nextNav;$('prevTrail').textContent=tr().previous;$('nextTrail').textContent=tr().nextNav;$('homeTrail').textContent=tr().home;renderTools();renderAgent()}
$('lang').onclick=()=>{language=language==='en'?'ar':'en';$('toolChat').replaceChildren();agentStep=0;localize()};$('askQuestion').onclick=ask;$('userQuestion').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});$('resetQuestion').onclick=()=>{$('toolChat').replaceChildren();$('userQuestion').value=''};$('nextAgent').onclick=()=>{agentStep=Math.min(agentStep+1,tr().agentSteps.length-1);renderAgent()};$('restartAgent').onclick=()=>{agentStep=0;renderAgent()};localize();</script></body></html>
