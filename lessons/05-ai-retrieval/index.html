ب كل مجموعة إجابة أكثر أماناً تستند إلى المعلومات.','ناقش لماذا يمكن أن يبدو الذكاء الاصطناعي واثقاً حتى لو لم يعرف.'],restart:'أعد من البداية',score:'القرارات الصحيحة'}};
const CASES={en:[
{q:'How many moons does Planet Nova have?',claim:'Planet Nova definitely has five moons.',facts:'Planet Nova is an imaginary planet. It has three moons. The sky is purple.',type:'wrong',safe:'Planet Nova has three moons.',reason:'The source specifically says three moons, not five.'},
{q:'What is the robot’s favourite colour?',claim:'Its favourite colour is turquoise.',facts:'Alex is a friendly imaginary robot. Alex’s favourite colour is turquoise. Alex paints pictures of planets.',type:'supported',safe:'Its favourite colour is turquoise.',reason:'The information directly states turquoise.'},
{q:'How old is the robot?',claim:'The robot is 12 years old.',facts:'Alex is a friendly imaginary robot. Alex loves astronomy and has a pet dragon called Spark.',type:'missing',safe:'I don’t know its age from this information.',reason:'No age is mentioned. Plausible details are not evidence.'},
{q:'Where is the school library?',claim:'The library is on the first floor.',facts:'The school library is on the ground floor, opposite the science lab.',type:'wrong',safe:'The library is on the ground floor, opposite the science lab.',reason:'The answer conflicts with the actual location.'},
{q:'What food does the astronaut like?',claim:'The astronaut loves star-shaped pasta.',facts:'The fictional astronaut is called Zara. Zara loves star-shaped pasta and collects postcards.',type:'supported',safe:'Zara loves star-shaped pasta.',reason:'This answer is supported by the source rather than by a guess.'}
],ar:[
{q:'كم قمراً لكوكب نوفا؟',claim:'لكوكب نوفا خمسة أقمار بالتأكيد.',facts:'نوفا كوكب خيالي. له ثلاثة أقمار. والسماء فيه بنفسجية.',type:'wrong',safe:'لكوكب نوفا ثلاثة أقمار.',reason:'تذكر المعلومات ثلاثة أقمار بوضوح، وليس خمسة.'},
{q:'ما اللون المفضل للروبوت؟',claim:'لونه المفضل هو الفيروزي.',facts:'نور روبوت خيالي لطيف. لونه المفضل هو الفيروزي. يحب رسم الكواكب.',type:'supported',safe:'لونه المفضل هو الفيروزي.',reason:'ذكر النص اللون الفيروزي مباشرة.'},
{q:'كم عمر الروبوت؟',claim:'عمر الروبوت اثنتا عشرة سنة.',facts:'نور روبوت خيالي لطيف. يحب الفلك ولديه تنين أليف اسمه برق.',type:'missing',safe:'لا أعرف عمره من هذه المعلومات.',reason:'لا يوجد عمر في النص. الاحتمال وحده لا يعتبر دليلاً.'},
{q:'أين تقع مكتبة المدرسة؟',claim:'تقع المكتبة في الطابق الأول.',facts:'تقع مكتبة المدرسة في الطابق الأرضي، مقابل مختبر العلوم.',type:'wrong',safe:'تقع مكتبة المدرسة في الطابق الأرضي مقابل مختبر العلوم.',reason:'تخالف الإجابة الموقع المذكور في المعلومات.'},
{q:'ما الطعام الذي تحبه رائدة الفضاء؟',claim:'تحب المعكرونة على شكل نجوم.',facts:'اسم رائدة الفضاء الخيالية سارة. تحب المعكرونة على شكل نجوم وتجمع البطاقات البريدية.',type:'supported',safe:'تحب سارة المعكرونة على شكل نجوم.',reason:'الإجابة مدعومة بما ورد في النص، وليست تخميناً.'}
]};
const $=id=>document.getElementById(id);let lang='en',index=0,choice='',score=0,checked=[];
function localize(){let t=CONTENT[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t]||''});$('teacherSteps').replaceChildren();t.teacherSteps.forEach(x=>{const li=document.createElement('li');li.textContent=x;$('teacherSteps').append(li)})}
function showCase(){let c=CASES[lang][index],t=CONTENT[lang];$('question').textContent=c.q;$('claim').textContent='🤖 '+c.claim;$('knowledge').textContent=c.facts;$('feedback').textContent=t.idle;$('feedback').classList.add('waiting');choice='';document.querySelectorAll('[data-choice]').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-pressed','false')});$('check').disabled=false;$('progressText').textContent=(index+1)+' / '+CASES[lang].length+' · '+t.score+': '+score;$('progress').replaceChildren();CASES[lang].forEach((_,i)=>{const s=document.createElement('span');if(checked.includes(i))s.classList.add('done');$('progress').append(s)});$('nextCase').textContent=index===CASES[lang].length-1?t.restart:t.nextCase}
document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{choice=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))})}));
