*{box-sizing:border-box}body{margin:0;line-height:1.58;background:radial-gradient(circle at 84% 3%,#19336c 0,transparent 35%),#080f20;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#9dbfff;text-decoration:none}a:hover{text-decoration:underline}.shell{width:min(1060px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid #324669;background:#0c1830d9;position:sticky;top:0;z-index:2;backdrop-filter:blur(13px)}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;flex-wrap:wrap}.brand{color:#f5f8ff;font-size:1.07rem;font-weight:850}.navright{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.button,.language{border:1px solid #667ca4;border-radius:12px;padding:9px 14px;background:#182a4b;color:#f7faff;font-weight:740;display:inline-block}.button:hover,.language:hover{filter:brightness(1.15);text-decoration:none}.button.primary{background:#628bfa;color:#06142b;border-color:#628bfa}.button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8cbdff;outline-offset:2px}.hero{padding:52px 0 18px}.eyebrow{font-size:.81rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#afc8ff}.hero h1{font-size:clamp(1.9rem,4vw,3.25rem);line-height:1.18;margin:10px 0 12px;letter-spacing:-.035em}.hero p{max-width:800px;color:#bbcae2;font-size:1.05rem}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.panel{border:1px solid #3b537a;border-radius:20px;background:#111e37;padding:22px;min-width:0}.panel h2{font-size:1.23rem;margin:0 0 10px}.panel p{margin:8px 0}.field{margin:16px 0}.field label{display:block;font-weight:750;margin:0 0 7px}.input{display:block;width:100%;background:#09172f;border:1px solid #5c779e;border-radius:11px;padding:12px;color:#f3f7ff}.input[dir=rtl]{text-align:right}.input textarea{resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px}.tiny{font-size:.83rem;color:#a rflow:hidden;clip:rect(0,0,0,0)}html[dir=rtl] .hero h1{letter-spacing:0}html[dir=rtl] .predict-line .pct{text-align:left}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding-top:35px}.panel{padding:17px}.navright{gap:6px}.navright .button{font-size:.85rem;padding:8px}}

<main class="shell"><section class="hero"><div class="eyebrow" data-i="eyebrow">LESSON 06 · LIGHTWEIGHT LAB</div><h1 data-i="title">Build Your Own AI Digital Twin</h1><p data-i="intro"></p></section><section class="layout"><div class="panel"><h2 data-i="buildTitle"></h2><p class="tiny" data-i="privacy"></p><div class="field"><label for="knowledge" data-i="knowledgeLabel"></label><textarea class="input" id="knowledge" rows="11" maxlength="30000"></textarea></div><div class="field"><label for="upload" data-i="uploadLabel"></label><input type="file" id="upload" accept=".txt,text/plain" class="input"></div><div class="row"><button class="button" id="example" data-i="restore"></button><button class="button" id="download" data-i="download"></button></div></div><div class="panel"><h2 data-i="talkTitle"></h2><div class="field"><label for="question" data-i="questionLabel"></label><input class="input" id="question" maxlength="400" autocomplete="off"></div><div class="row"><button class="button primary" id="ask" data-i="askButton"></button><button class="button" id="clear" data-i="clearButton"></button></div><div class="divider"></div><div class="labelled" data-i="answerTitle"></div><div class="result" id="answer" aria-live="polite"></div><div class="labelled" style="margin-top:22px" data-i="sourceTitle"></div><div class="result" id="source"></div><div class="labelled" style="margin-top:22px" data-i="chatTitle"></div><div class="list" id="history"></div></div></section><section class="panel"><h2 data-i="capstoneTitle"></h2><p data-i="capstoneDesc"></p><div class="row"><a class="button" href="gradio-app/README.md" data-i="gradioGuide"></a><a class="button" href="gradio-app/app.py" download data-i="pythonFile"></a><a class="button" href="gradio-app/about-me.txt" download data-i="textFile"></a></div><p class="notice" data-i="honesty"></p></section></main><footer class="shell footer"><p data-i="caveat"></p><p><a href="../../">AI Learning Lab</a> · <a href="README.md">Lesson guide (English)</a> · <a href="README.ar.md">دليل الدرس</a></p></footer>
<script>const T={"en": {"eyebrow": "LESSON 06 · CAPSTONE PROJECT", "title": "Build Your Own AI Digital Twin", "intro": "Build a tiny question-answering assistant from a text file. Ask questions, inspect the source and watch it say “I don’t know” when the information is missing.", "previous": "← Lesson 05", "next": "All lessons", "buildTitle": "1. Build its knowledge file", "privacy": "Use imaginary characters, not real children’s names, addresses or private information. Everything here stays in your browser.", "knowledgeLabel": "Knowledge text: one fact or sentence per line", "uploadLabel": "Or load a .txt file from this computer", "restore": "Restore imaginary example", "download": "Save as about-me.txt", "talkTitle": "2. Ask your digital twin", "questionLabel": "Your question", "askButton": "Ask", "clearButton": "Clear chat", "answerTitle": "Answer / relevant evidence", "sourceTitle": "Source that supports the reply", "chatTitle": "Conversation in this tab", "capstoneTitle": "3. Make it a Gradio app", "capstoneDesc": "This release includes a small Python + Gradio project that uses the same source-first approach. It can run on a teacher’s computer; optional Hugging Face publication needs setup and hosting.", "gradioGuide": "Gradio setup guide", "pythonFile": "Download app.py", "textFile": "Example knowledge file", "honesty": "This browser assistant is an extractive retrieval system, not a pretrained or generative LLM. It returns an actual matching passage rather than inventing a fluent answer. The Gradio starter behaves the same way. No generated answer is claimed to be fact-checked automatically.", "unknown": "I don’t know from the information supplied.", "found": "Here is the most relevant information in my knowledge file:", "source": "Line", "noQuestion": "Write a question first.", "empty": "Knowledge file is empty. Add some fictional facts first.", "historyItem": "You asked:", "fresh": "No questions yet.", "caveat": "No API keys or accounts required for the browser activity. The optional Gradio project requires Python and installation of the Gradio package."}, "ar": {"eyebrow": "الدرس ٠٦ · المشروع الختامي", "title": "ابنِ توأمك الرقمي", "intro": "ابنِ مساعداً صغيراً يجيب انطلاقاً من ملف نصي. اطرح الأسئلة، وافحص المصدر وشاهده يقول «لا أعرف» إذا كانت المعلومات غير متوفرة.", "previous": "← الدرس ٠٥", "next": "جميع الدروس", "buildTitle": "١. أنشئ ملف المعرفة", "privacy": "استخدم شخصيات خيالية، لا أسماء الأطفال الحقيقية أو عناوينهم أو معلوماتهم الخاصة. تبقى البيانات في متصفحك.", "knowledgeLabel": "نص المعرفة: حقيقة أو جملة في كل سطر", "uploadLabel": "أو حمّل ملفاً نصياً من جهازك", "restore": "استعادة المثال الخيالي", "download": "احفظ باسم about-me.txt", "talkTitle": "٢. اسأل توأمك الرقمي", "questionLabel": "سؤالك", "askButton": "اسأل", "clearButton": "مسح المحادثة", "answerTitle": "الإجابة / الدليل ذي الصلة", "sourceTitle": "المصدر الذي يدعم الرد", "chatTitle": "المحادثة في علامة التبويب", "capstoneTitle": "٣. حوّله إلى تطبيق Gradio", "capstoneDesc": "يتضمّن هذا الإصدار مشروعاً صغيراً بلغة Python مع Gradio يعتمد على إظهار المصدر. يمكن تشغيله على جهاز المعلم، أما النشر على Hugging Face فهو اختياري ويتطلب إعداد استضافة.", "gradioGuide": "دليل إعداد Gradio", "pythonFile": "تنزيل app.py", "textFile": "ملف المعرفة النموذجي", "honesty": "مساعد المتصفح يعتمد على استرجاع النصوص وليس نموذجاً لغوياً مدرّباً أو مولّداً. يعرض مقطعاً مطابقاً من المصدر بدلاً من اختراع إجابة سلسة. وتعمل نسخة Gradio المبدئية بالطريقة نفسها. لا يُقدَّم أي جواب مولّد على أنه مُتحقَّق منه تلقائياً.", "unknown": "لا أعرف من المعلومات المتاحة.", "found": "هذه أكثر معلومة مرتبطة وجدتها في ملف المعرفة:", "source": "السطر", "noQuestion": "اكتب سؤالاً أولاً.", "empty": "ملف المعرفة فارغ. أضف بعض المعلومات الخيالية أولاً.", "historyItem": "سألت:", "fresh": "لم تُطرح أسئلة بعد.", "caveat": "لا يلزم حساب أو مفتاح API للنشاط داخل المتصفح. يتطلب مشروع Gradio الاختياري Python وتثبيت حزمة Gradio."}};
const $=id=>document.getElementById(id);
const stop={en:new Set('the a an is are was were be been being and or to for of in on at with from this that it its i my your our you what where when how who which does do did can could should many much tell me about please in the'.split(' ')),ar:new Set('ما ماذا من أين متى كيف هل كم في على عن إلى الى و أو أن إن هو هي هذا هذه ذلك تلك التي الذي لدى عند عنده يكون تكون أريد لي لنا يا ثم مع عدد يوجد موجود'.split(' '))};
function toks(s){return (s.toLocaleLowerCase().normalize('NFKC').match(/[\p{L}\p{M}\p{N}]+(?:['’-][\p{L}\p{M}\p{N}]+)*/gu)||[])}
function norm(s){let w=s.toLocaleLowerCase().normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي');return w}
function useful(s){return toks(s).map(norm).filter(w=>w.length>1&&!new Set([...stop[lang]].map(norm)).has(w))}
function clean(str){return (str||'').replace(/\r/g,'').trim()}
function safeLines(s){return clean(s).split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,250)}
function addText(parent,tag,value,css){const e=document.createElement(tag);if(css)e.className=css;e.textContent=value;parent.append(e);return e}
function setStatus(id,msg){$(id).textContent=msg}
let lang='en';
function localize(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T[lang][el.dataset.i]??el.dataset.i});document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=T[lang][el.dataset.ph]??''})}
$('lang').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';localize();reset()});


const samples={en:'My name is Alex the friendly imaginary robot.\nI live on a fictional planet called Luma.\nMy favourite food is star-shaped pasta.\nI love painting pictures of planets.\nI have a pet dragon called Spark.\nMy favourite colour is turquoise.',ar:'اسمي نور وأنا روبوت خيالي لطيف.\nأسكن على كوكب خيالي اسمه لونا.\nطعامي المفضل هو المعكرونة على شكل نجوم.\nأحب رسم صور للكواكب.\nلدي تنين أليف اسمه برق.\nلوني المفضل هو الفيروزي.'};
let chat=[];
const localStop={en:new Set('what where when why how which is are was were the a an i you your my does do has have tell me about of in for to'.split(' ')),ar:new Set('ما ماذا من اين أين متى كيف لماذا هو هي هل في من عن على ما هو اسم لدي عندي'.split(' '))};
function important(s){return toks(s).map(norm).filter(w=>w.length>1&&!localStop[lang].has(w))}
function match(q){const qwords=new Set(important(q));const lines=safeLines($('knowledge').value);const scored=lines.map((text,i)=>{const words=new Set(important(text));let score=0;qwords.forEach(w=>{if(words.has(w))score++});return {text,i,score}}).sort((a,b)=>b.score-a.score||a.i-b.i);return scored[0] && scored[0].score >= (qwords.size >= 2 ? 2 : 1) ? scored[0] : null}
function showChat(){const target=$('history');target.replaceChildren();if(!chat.length)addText(target,'span',T[lang].fresh,'tiny');for(const q of chat.slice().reverse())addText(target,'p',T[lang].historyItem+' '+q,'quote')}
function ask(){const q=clean($('question').value);if(!q){setStatus('answer',T[lang].noQuestion);return}if(!clean($('knowledge').value)){setStatus('answer',T[lang].empty);setStatus('source','—');return}const hit=match(q);setStatus('answer',hit?T[lang].found+'\n“'+hit.text+'”':T[lang].unknown);setStatus('source',hit?T[lang].source+' '+(hit.i+1)+': '+hit.text:'—');chat.push(q);showChat()}
function reset(){ $('knowledge').value=samples[lang];$('question').value='';chat=[];setStatus('answer',T[lang].fresh);setStatus('source','—');showChat() }
$('ask').addEventListener('click',ask);$('clear').addEventListener('click',()=>{chat=[];showChat();setStatus('answer',T[lang].fresh);setStatus('source','—')});$('example').addEventListener('click',reset);
$('upload').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>250000){setStatus('answer',lang==='ar'?'الملف كبير جداً. اختر ملفاً أقل من 250 كيلوبايت.':'File too large. Choose a file under 250 KB.');return}try{$('knowledge').value=await f.text();setStatus('answer',lang==='ar'?'تم تحميل الملف محلياً.':'File loaded locally.')}catch(err){setStatus('answer',lang==='ar'?'تعذّر قراءة الملف.':'Could not read the file.')}});
$('download').addEventListener('click',()=>{const blob=new Blob([$('knowledge').value],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='about-me.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});

localize();reset();</script></body></html>
